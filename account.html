<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("asb_theme")||"light")</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>حسابي — منصة د.علاء صبح</title>
<link rel="stylesheet" href="style.css?v=11">
<link rel="stylesheet" href="theme.css?v=3">
<link rel="stylesheet" href="shell.css?v=2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* صفحة حسابي — تصميم جديد بالكامل، كل الكلاسات بادئة بـ ac- */
.ac{max-width:1100px;margin:0 auto;padding:6px 0 56px}
.ac *{box-sizing:border-box}
.ac button{font-family:inherit}
.ac-card{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)}

/* ===== البطاقة الرئيسية ===== */
.ac-hero{position:relative;overflow:hidden;border-radius:24px;background:var(--gradient-primary);color:#fff;box-shadow:var(--shadow-lift)}
.ac-hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 12% 120%,rgba(52,211,168,.28),transparent 42%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px);pointer-events:none}
.ac-hero-top{position:relative;display:flex;align-items:center;gap:22px;padding:30px 30px 24px}
.ac-ring{position:relative;flex-shrink:0;width:122px;height:122px}
.ac-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ac-ring circle{fill:none;stroke-width:6}
.ac-ring .bg{stroke:rgba(255,255,255,.18)}
.ac-ring .fg{stroke:var(--teal-light);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset 1s ease}
.ac-av{position:absolute;inset:11px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#34D3A8,#0F9F82);color:#04251D;font-family:'Cairo',sans-serif;font-weight:800;font-size:44px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.ac-id{min-width:0;flex:1}
.ac-name{margin:0 0 8px;font-family:'Cairo',sans-serif;font-weight:800;font-size:clamp(21px,3.4vw,30px);line-height:1.4;color:#fff;overflow-wrap:anywhere}
.ac-chips{display:flex;flex-wrap:wrap;gap:10px}
.ac-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);font-size:13px;font-weight:700;color:#fff;backdrop-filter:blur(6px)}
.ac-chip i{color:var(--teal-light)}
.ac-chip b{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:1.5px;direction:ltr;font-size:13px}
.ac-chip button{border:0;background:rgba(255,255,255,.16);color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.ac-chip button:hover{background:rgba(255,255,255,.28)}
.ac-edit{flex-shrink:0;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:0;border-radius:999px;background:#fff;color:var(--primary-dark);font-weight:800;font-size:14px;cursor:pointer;transition:transform .15s}
:root[data-theme="dark"] .ac-edit{color:#06142B}
.ac-edit:hover{transform:translateY(-2px)}
.ac-kpis{position:relative;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.14);background:rgba(5,14,31,.28)}
.ac-kpi{padding:16px 10px;text-align:center}
.ac-kpi+.ac-kpi{border-inline-start:1px solid rgba(255,255,255,.1)}
.ac-kpi b{display:block;font-family:'Cairo',sans-serif;font-size:22px;font-weight:800;color:#fff}
.ac-kpi small{font-size:12px;font-weight:600;color:rgba(255,255,255,.72)}

/* ===== التبويبات ===== */
.ac-tabs{display:flex;gap:6px;margin:22px 0 18px;padding:6px;border-radius:999px;background:var(--card-bg);border:1px solid var(--border);box-shadow:var(--shadow);position:sticky;top:76px;z-index:20}
.ac-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:12px 10px;border:0;border-radius:999px;background:none;color:var(--text-muted);font-size:14.5px;font-weight:800;cursor:pointer;transition:.18s}
.ac-tab:hover{color:var(--text)}
.ac-tab.on{background:var(--gradient-primary);color:#fff;box-shadow:0 6px 16px rgba(11,36,71,.25)}
.ac-pane[hidden]{display:none}

/* ===== معلوماتي ===== */
.ac-info{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ac-tile{display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;background:var(--card-bg);border:1px solid var(--border);box-shadow:var(--shadow)}
.ac-tile .ico{flex-shrink:0;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--primary-tint);color:var(--primary-light);font-size:17px}
.ac-tile:nth-child(even) .ico{background:var(--teal-pale);color:var(--teal-dark)}
:root[data-theme="dark"] .ac-tile:nth-child(even) .ico{color:var(--teal)}
.ac-tile div{min-width:0}
.ac-tile small{display:block;margin-bottom:2px;font-size:12.5px;font-weight:700;color:var(--text-muted)}
.ac-tile b{display:block;font-size:16px;font-weight:800;color:var(--text);overflow-wrap:anywhere}
.ac-tile b.empty{color:var(--text-muted);font-weight:600;font-size:14px}
.ac-tile b.num{direction:ltr;text-align:right}

/* ===== اشتراكاتي ===== */
.ac-subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.ac-sub{display:flex;flex-direction:column;overflow:hidden;border-radius:20px;background:var(--card-bg);border:1px solid var(--border);box-shadow:var(--shadow);text-decoration:none;color:var(--text);transition:transform .2s,box-shadow .2s}
.ac-sub:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift)}
.ac-cover{position:relative;aspect-ratio:16/8;background:var(--gradient-primary);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:40px}
.ac-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ac-done{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--gradient-gold);color:#04251D;font-size:12px;font-weight:800}
.ac-sub-b{padding:16px 18px 18px}
.ac-sub-t{margin:0 0 6px;font-size:16px;font-weight:800;line-height:1.55}
.ac-sub-m{font-size:12.5px;font-weight:600;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.ac-prog{display:flex;align-items:center;gap:10px;margin:14px 0 12px}
.ac-bar{flex:1;height:8px;border-radius:999px;background:var(--cream-deep);overflow:hidden}
.ac-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary-light),var(--teal))}
.ac-prog span{font-size:13px;font-weight:800;color:var(--text)}
.ac-go{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:800;color:var(--primary-light)}
:root[data-theme="dark"] .ac-go{color:var(--primary)}

/* ===== اختباراتي ===== */
.ac-filter{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:thin}
.ac-fchip{flex-shrink:0;padding:8px 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text-muted);font-size:13px;font-weight:800;cursor:pointer}
.ac-fchip.on{background:var(--primary-tint);border-color:var(--primary-light);color:var(--primary-light)}
.ac-exams{display:flex;flex-direction:column;gap:12px}
.ac-ex{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:18px;background:var(--card-bg);border:1px solid var(--border);box-shadow:var(--shadow)}
.ac-pct{flex-shrink:0;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--cream-deep) 0)}
.ac-pct span{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card-bg);font-size:13.5px;font-weight:800;color:var(--text)}
.ac-ex-b{flex:1;min-width:0}
.ac-ex-t{margin:0 0 4px;font-size:15.5px;font-weight:800;color:var(--text);overflow-wrap:anywhere}
.ac-ex-s{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;font-weight:600;color:var(--text-muted)}
.ac-ex-s i{margin-inline-end:5px;color:var(--teal)}
.ac-ex-sc{margin-top:6px;font-size:13px;font-weight:800;color:var(--text)}
.ac-view{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--border);color:var(--primary);text-decoration:none;font-size:13px;font-weight:800;transition:.15s}
.ac-view:hover{border-color:var(--primary-light);background:var(--primary-tint)}
.ac-empty{text-align:center;padding:56px 16px;border-radius:20px;border:1.5px dashed var(--border);color:var(--text-muted);font-size:14.5px;font-weight:600}
.ac-empty i{display:block;margin-bottom:12px;font-size:36px;color:var(--teal)}
.ac-empty a{display:inline-flex;margin-top:14px;padding:10px 22px;border-radius:999px;background:var(--gradient-primary);color:#fff;text-decoration:none;font-weight:800;font-size:13.5px}

/* ===== نافذة التعديل ===== */
.ac-modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,14,31,.6);backdrop-filter:blur(4px)}
.ac-modal.open{display:flex}
.ac-sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:24px;background:var(--card-bg);border:1px solid var(--border);box-shadow:0 30px 70px rgba(0,0,0,.4);animation:acin .25s ease}
@keyframes acin{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.ac-sh-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;background:var(--gradient-primary);color:#fff}
.ac-sh-h h3{margin:0;font-size:17px;font-weight:800;color:#fff;display:flex;gap:10px;align-items:center}
.ac-x{width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;font-size:14px}
.ac-x:hover{background:rgba(255,255,255,.28)}
.ac-sh-b{padding:22px}
.ac-f{margin-bottom:16px}
.ac-f label{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:13px;font-weight:800;color:var(--text)}
.ac-f label i{color:var(--teal)}
.ac-f input{width:100%;padding:13px 16px;font:inherit;font-size:15px;border-radius:14px}
.ac-msg{display:none;margin-bottom:14px;padding:11px 14px;border-radius:12px;font-size:13px;font-weight:700;line-height:1.7}
.ac-msg.show{display:block}
.ac-msg.error{background:rgba(229,72,77,.12);color:var(--danger)}
.ac-msg.success{background:var(--teal-pale);color:var(--teal-dark)}
.ac-sh-f{display:flex;gap:10px}
.ac-save{flex:1;padding:13px;border:0;border-radius:14px;background:var(--gradient-primary);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.ac-save:disabled{opacity:.6}
.ac-cancel{padding:13px 22px;border-radius:14px;border:1.5px solid var(--border);background:none;color:var(--text);font-weight:800;font-size:15px;cursor:pointer}

@media (max-width:760px){
  .ac-hero-top{flex-direction:column;align-items:center;text-align:center;padding:26px 18px 20px}
  .ac-chips{justify-content:center}
  .ac-edit{align-self:center}
  .ac-kpis{grid-template-columns:repeat(2,1fr)}
  .ac-kpi:nth-child(3){border-inline-start:0}
  .ac-kpi:nth-child(n+3){border-top:1px solid rgba(255,255,255,.1)}
  .ac-info{grid-template-columns:1fr}
  .ac-tab{font-size:13px;padding:11px 6px;gap:6px}
  .ac-tabs{top:68px}
  .ac-ex{flex-wrap:wrap}
  .ac-view{width:100%;justify-content:center}
}
@media (max-width:420px){.ac-tab i{display:none}}
@media (prefers-reduced-motion:reduce){.ac *{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="nv" id="appHeader"></header>

<main class="page"><div class="ac">

  <!-- البطاقة الرئيسية -->
  <section class="ac-hero">
    <div class="ac-hero-top">
      <div class="ac-ring" title="متوسط تقدمك في الاشتراكات">
        <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52"/></svg>
        <div class="ac-av" id="avatar">؟</div>
      </div>
      <div class="ac-id">
        <h1 class="ac-name" id="heroName">—</h1>
        <div class="ac-chips">
          <span class="ac-chip"><i class="fas fa-building"></i> <span id="heroCenter">—</span></span>
          <span class="ac-chip" title="كودك الخاص"><i class="fas fa-shield-halved"></i> <b id="heroCode">••••••••••••</b>
            <button type="button" id="copyBtn" aria-label="نسخ الكود"><i class="fas fa-copy"></i></button></span>
        </div>
      </div>
      <button type="button" class="ac-edit" id="editBtn"><i class="fas fa-pen"></i> تعديل بياناتي</button>
    </div>
    <div class="ac-kpis">
      <div class="ac-kpi"><b id="kSubs">0</b><small>اشتراكاتي</small></div>
      <div class="ac-kpi"><b id="kAvg">0%</b><small>متوسط التقدم</small></div>
      <div class="ac-kpi"><b id="kExams">0</b><small>اختبار تم حله</small></div>
      <div class="ac-kpi"><b id="kBest">—</b><small>أفضل نتيجة</small></div>
    </div>
  </section>

  <!-- التبويبات -->
  <nav class="ac-tabs" role="tablist">
    <button type="button" class="ac-tab on" data-t="info" role="tab"><i class="fas fa-id-card"></i> معلوماتي</button>
    <button type="button" class="ac-tab" data-t="subs" role="tab"><i class="fas fa-book-open"></i> اشتراكاتي</button>
    <button type="button" class="ac-tab" data-t="exams" role="tab"><i class="fas fa-pen-to-square"></i> اختباراتي</button>
  </nav>

  <div class="ac-pane" data-t="info">
    <div class="ac-info">
      <div class="ac-tile"><span class="ico"><i class="fas fa-user"></i></span><div><small>الاسم</small><b id="iName">—</b></div></div>
      <div class="ac-tile"><span class="ico"><i class="fas fa-building"></i></span><div><small>السنتر</small><b id="iCenter">—</b></div></div>
      <div class="ac-tile"><span class="ico"><i class="fas fa-mobile-screen"></i></span><div><small>رقم تليفون الطالب</small><b id="iPhone" class="num">—</b></div></div>
      <div class="ac-tile"><span class="ico"><i class="fas fa-user-shield"></i></span><div><small>رقم تليفون ولي الأمر</small><b id="iParent" class="num">—</b></div></div>
    </div>
  </div>

  <div class="ac-pane" data-t="subs" hidden><div id="subsWrap"><div class="center-loading"><div class="loader"></div></div></div></div>

  <div class="ac-pane" data-t="exams" hidden>
    <div class="ac-filter" id="exFilter" style="display:none"></div>
    <div id="exWrap"><div class="center-loading"><div class="loader"></div></div></div>
  </div>
</div></main>

<!-- نافذة التعديل -->
<div class="ac-modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <div class="ac-sheet">
    <div class="ac-sh-h"><h3 id="editTitle"><i class="fas fa-user-pen"></i> تعديل بياناتي</h3><button type="button" class="ac-x" id="closeBtn" aria-label="إغلاق"><i class="fas fa-xmark"></i></button></div>
    <div class="ac-sh-b">
      <div class="ac-msg" id="editMsg"></div>
      <div class="ac-f"><label for="fName"><i class="fas fa-user"></i> اسم الطالب</label><input type="text" id="fName" placeholder="اسمك الكامل" dir="rtl"></div>
      <div class="ac-f"><label for="fPhone"><i class="fas fa-mobile-screen"></i> رقم تليفون الطالب</label><input type="tel" id="fPhone" inputmode="numeric" maxlength="11" autocomplete="off" placeholder="01XXXXXXXXX" dir="ltr"></div>
      <div class="ac-f"><label for="fParent"><i class="fas fa-user-shield"></i> رقم تليفون ولي الأمر</label><input type="tel" id="fParent" inputmode="numeric" maxlength="11" autocomplete="off" placeholder="01XXXXXXXXX" dir="ltr"></div>
      <div class="ac-sh-f"><button type="button" class="ac-save" id="saveBtn"><i class="fas fa-floppy-disk"></i> حفظ التغييرات</button><button type="button" class="ac-cancel" id="cancelBtn">إلغاء</button></div>
    </div>
  </div>
</div>

<footer class="ft" id="siteFooter"></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=10"></script>
<script src="icons.js?v=3"></script>
<script src="app-shell.js?v=7"></script>
<script>
const $ = function (id) { return document.getElementById(id); };
let currentUser = null, currentUserData = null, allExams = [], exFilter = 'all';
const S = { subs: 0, avg: 0, exams: 0, best: null };

requireAuth(function (user, ud) {
  currentUser = user; currentUserData = ud;
  renderAppHeader(user, ud, { showPoints: false });
  renderFooter();
  renderInfo(); setupTabs(); setupEdit();
  loadSubs(); loadExams();
});

function paintKpis() {
  $('kSubs').textContent = S.subs;
  $('kAvg').textContent = S.avg + '%';
  $('kExams').textContent = S.exams;
  $('kBest').textContent = S.best === null ? '—' : S.best + '%';
  $('ringFg').style.strokeDashoffset = 327 - 327 * Math.min(100, S.avg) / 100;
}

/* ===== معلوماتي + البطاقة الرئيسية ===== */
function renderInfo() {
  const d = currentUserData, name = d.name || 'مستخدم', center = d.centerName ? 'سنتر ' + d.centerName : 'سنتر';
  $('heroName').textContent = name;
  $('heroCenter').textContent = center;
  $('avatar').textContent = (name.trim().charAt(0)) || '؟';
  $('iName').textContent = d.name || '—';
  $('iCenter').textContent = center;
  const ph = $('iPhone');
  if (d.phone) { ph.textContent = d.phone; ph.classList.remove('empty'); } else { ph.textContent = 'لم يتم إضافة رقم هاتف'; ph.classList.add('empty'); ph.classList.remove('num'); }
  $('iParent').textContent = d.parentPhone || '—';
  if (window.getOrCreateWatermarkCode) getOrCreateWatermarkCode(currentUser.uid, function (code) {
    $('heroCode').textContent = code;
    $('copyBtn').onclick = function () {
      const ic = this.querySelector('i');
      const done = function () { ic.className = 'fas fa-check'; setTimeout(function () { ic.className = 'fas fa-copy'; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done); else prompt('انسخ الكود:', code);
    };
  });
}

/* ===== التبويبات ===== */
function setupTabs() {
  const tabs = document.querySelectorAll('.ac-tab');
  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      tabs.forEach(function (x) { x.classList.toggle('on', x === t); x.setAttribute('aria-selected', x === t); });
      document.querySelectorAll('.ac-pane').forEach(function (p) { p.hidden = p.dataset.t !== t.dataset.t; });
    });
  });
}

/* ===== اشتراكاتي ===== */
function loadSubs() {
  const wrap = $('subsWrap');
  db.ref('userEnrollments/' + currentUser.uid).on('value', function (snap) {
    const ids = Object.keys(snap.val() || {});
    if (!ids.length) {
      S.subs = 0; S.avg = 0; paintKpis();
      wrap.innerHTML = '<div class="ac-empty"><i class="fas fa-book-open"></i>لا توجد اشتراكات حالية<br><a href="courses.html">تصفّح الكورسات</a></div>';
      return;
    }
    Promise.all([
      Promise.all(ids.map(function (id) { return db.ref('competitions/' + id).once('value').then(function (s) { return { id: id, data: s.val() }; }); })),
      db.ref('userProgress/' + currentUser.uid).once('value')
    ]).then(function (r) {
      const all = r[1].val() || {};
      const items = r[0].filter(function (x) { return x.data; }).map(function (x) {
        const lessons = x.data.lessons || {};
        return { id: x.id, d: x.data, n: Object.keys(lessons).length, pct: window.computeCourseProgress ? computeCourseProgress(lessons, all[x.id] || {}) : 0 };
      });
      S.subs = items.length;
      S.avg = items.length ? Math.round(items.reduce(function (s, x) { return s + x.pct; }, 0) / items.length) : 0;
      paintKpis();
      if (!items.length) { wrap.innerHTML = '<div class="ac-empty"><i class="fas fa-book-open"></i>لا توجد اشتراكات</div>'; return; }
      wrap.innerHTML = '<div class="ac-subs">' + items.map(function (x) {
        const img = x.d.coverUrl || x.d.image, done = x.pct >= 100;
        return '<a class="ac-sub" href="competition.html?id=' + encodeURIComponent(x.id) + '">' +
          '<div class="ac-cover">' + (img ? '<img src="' + escapeHtml(img) + '" alt="" loading="lazy">' : '<i class="fas fa-book-open"></i>') + (done ? '<span class="ac-done"><i class="fas fa-check"></i> مكتمل</span>' : '') + '</div>' +
          '<div class="ac-sub-b"><h3 class="ac-sub-t">' + escapeHtml(x.d.title || 'بدون عنوان') + '</h3>' +
          '<div class="ac-sub-m"><i class="fas fa-layer-group"></i> ' + x.n + ' محاضرة</div>' +
          '<div class="ac-prog"><div class="ac-bar"><i style="width:' + x.pct + '%"></i></div><span>' + x.pct + '%</span></div>' +
          '<div class="ac-go"><span>' + (done ? 'مراجعة المحتوى' : 'متابعة التعلم') + '</span><i class="fas fa-arrow-left"></i></div></div></a>';
      }).join('') + '</div>';
    });
  });
}

/* ===== اختباراتي ===== */
function loadExams() {
  const wrap = $('exWrap');
  db.ref('userProgress/' + currentUser.uid).once('value').then(function (snap) {
    const progress = snap.val() || {}, raw = [];
    Object.keys(progress).forEach(function (c) {
      Object.keys(progress[c] || {}).forEach(function (l) {
        const exams = (progress[c][l] || {}).exams || {};
        Object.keys(exams).forEach(function (e) {
          const x = exams[e];
          if (x && x.completed === true) raw.push({ compId: c, lessonId: l, examId: e, score: x.score || 0, total: x.totalQuestions, at: x.answeredAt || Date.now() });
        });
      });
    });
    if (!raw.length) { allExams = []; paintExams(); return; }
    const cids = Array.from(new Set(raw.map(function (x) { return x.compId; })));
    return Promise.all(cids.map(function (id) { return db.ref('competitions/' + id).once('value').then(function (s) { return { id: id, d: s.val() || {} }; }); })).then(function (res) {
      const map = {}; res.forEach(function (r) { map[r.id] = r.d; });
      allExams = raw.map(function (x) {
        const c = map[x.compId] || {}, ex = (((c.lessons || {})[x.lessonId] || {}).exams || {})[x.examId] || {};
        const total = x.total || ex.questionCount || 10;
        return Object.assign({}, x, { compTitle: c.title || 'بدون عنوان', title: ex.title || 'اختبار', total: total, pct: Math.max(0, Math.min(100, Math.round(x.score / total * 100))) });
      }).sort(function (a, b) { return b.at - a.at; });
      paintExams();
    });
  }).catch(function (err) { wrap.innerHTML = '<div class="ac-empty"><i class="fas fa-circle-exclamation"></i>حدث خطأ: ' + escapeHtml(err.message) + '</div>'; });
}
function paintExams() {
  S.exams = allExams.length; S.best = allExams.length ? Math.max.apply(null, allExams.map(function (e) { return e.pct; })) : null; paintKpis();
  const bar = $('exFilter'), seen = {}, comps = [];
  allExams.forEach(function (e) { if (!seen[e.compId]) { seen[e.compId] = 1; comps.push(e); } });
  if (comps.length > 1) {
    bar.innerHTML = '<button type="button" class="ac-fchip' + (exFilter === 'all' ? ' on' : '') + '" data-c="all">الكل</button>' + comps.map(function (c) { return '<button type="button" class="ac-fchip' + (exFilter === c.compId ? ' on' : '') + '" data-c="' + escapeHtml(c.compId) + '">' + escapeHtml(c.compTitle) + '</button>'; }).join('');
    bar.style.display = 'flex';
    bar.querySelectorAll('.ac-fchip').forEach(function (b) { b.onclick = function () { exFilter = b.dataset.c; paintExams(); }; });
  } else { bar.style.display = 'none'; exFilter = 'all'; }
  const list = exFilter === 'all' ? allExams : allExams.filter(function (e) { return e.compId === exFilter; });
  if (!list.length) { $('exWrap').innerHTML = '<div class="ac-empty"><i class="fas fa-inbox"></i>لم تحل أي اختبار حتى الآن</div>'; return; }
  $('exWrap').innerHTML = '<div class="ac-exams">' + list.map(function (e) {
    const rc = e.pct >= 80 ? 'var(--success)' : (e.pct >= 50 ? 'var(--teal)' : 'var(--danger)');
    return '<div class="ac-ex"><div class="ac-pct" style="--p:' + e.pct + ';--rc:' + rc + '"><span>' + e.pct + '%</span></div>' +
      '<div class="ac-ex-b"><h4 class="ac-ex-t">' + escapeHtml(e.title) + '</h4>' +
      '<div class="ac-ex-s"><span><i class="fas fa-book"></i>' + escapeHtml(e.compTitle) + '</span><span title="' + escapeHtml(formatArabicDate(e.at)) + '"><i class="fas fa-clock"></i>' + escapeHtml(formatRelativeArabicTime(e.at)) + '</span></div>' +
      '<div class="ac-ex-sc">' + e.score + ' من ' + e.total + ' إجابة صحيحة</div></div>' +
      '<a class="ac-view" href="exam.html?comp=' + encodeURIComponent(e.compId) + '&lesson=' + encodeURIComponent(e.lessonId) + '&exam=' + encodeURIComponent(e.examId) + '"><i class="fas fa-eye"></i> عرض الإجابات</a></div>';
  }).join('') + '</div>';
}

/* ===== تعديل البيانات ===== */
function setupEdit() {
  const modal = $('editModal'), msg = $('editMsg'), PHONE = /^01[0125][0-9]{8}$/;
  const fN = $('fName'), fP = $('fPhone'), fG = $('fParent'), save = $('saveBtn');
  const say = function (t, type) { msg.textContent = t; msg.className = 'ac-msg show ' + type; };
  const close = function () { modal.classList.remove('open'); document.body.style.overflow = ''; };
  [fP, fG].forEach(function (el) { el.addEventListener('input', function () { el.value = el.value.replace(/[^0-9]/g, '').slice(0, 11); }); });
  $('editBtn').onclick = function () {
    fN.value = currentUserData.name || ''; fP.value = currentUserData.phone || ''; fG.value = currentUserData.parentPhone || '';
    msg.className = 'ac-msg'; modal.classList.add('open'); document.body.style.overflow = 'hidden'; setTimeout(function () { fN.focus(); }, 80);
  };
  $('closeBtn').onclick = $('cancelBtn').onclick = close;
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal.classList.contains('open')) close(); });
  save.onclick = function () {
    const name = fN.value.trim().replace(/\s+/g, ' '), phone = fP.value.trim(), parent = fG.value.trim();
    if (name.split(' ').length < 2) return say('اكتب اسمك ثنائي على الأقل', 'error');
    if (!PHONE.test(phone)) return say('رقم تليفون الطالب غير صحيح', 'error');
    if (!PHONE.test(parent)) return say('رقم تليفون ولي الأمر غير صحيح', 'error');
    save.disabled = true;
    db.ref('users/' + currentUser.uid).update({ name: name, phone: phone, parentPhone: parent }).then(function () {
      currentUserData.name = name; currentUserData.phone = phone; currentUserData.parentPhone = parent;
      renderInfo(); say('تم حفظ التغييرات', 'success'); setTimeout(close, 800);
    }).catch(function () { say('تعذر الحفظ، حاول مرة أخرى', 'error'); }).then(function () { save.disabled = false; });
  };
}
