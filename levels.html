<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("asb_theme")||"light")</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>المستوى — منصة د.علاء صبح</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<header class="app-header" id="appHeader"></header>

<main class="page">
  <div class="home-hero">
    <div class="hero-greet">
      <div class="hero-greet-text">
        <h1 id="lvTitle">مستواك في المذاكرة</h1>
        <p id="lvSub"></p>
      </div>
    </div>
  </div>

  <section class="dashboard-section">
    <div style="max-width:380px; margin:0 auto;">
      <div class="progress-card">
        <div class="progress-pill-wrap">
          <div class="progress-pill">
            <span class="progress-pill-value" id="lvPct">0%</span>
            <div class="progress-pill-fill" id="lvFill"></div>
          </div>
        </div>
        <h4 id="lvNext">—</h4>
        <p>التقدم الكلي في كل الكورسات المشترك فيها.</p>
      </div>
    </div>
  </section>

  <div class="content-head"><h2 class="section-title">تفاصيل تقدمك</h2></div>
  <div class="stats-grid" id="statsGrid"></div>

  <div class="content-head"><h2 class="section-title">تقدمك في كل كورس</h2></div>
  <div id="courseBars"></div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js?v=2"></script>
<script src="app-shell.js?v=4"></script>
<script>
  requireAuth(function (user, userData) {
    renderAppHeader(user, userData);
    renderFooter();
    document.getElementById('lvSub').textContent = 'طالب سنتر ' + (userData.centerName || '');

    Promise.all([
      db.ref('competitions').once('value'),
      db.ref('userEnrollments/' + user.uid).once('value'),
      db.ref('userProgress/' + user.uid).once('value')
    ]).then(function (r) {
      const comps = r[0].val() || {}, enr = r[1].val() || {}, prog = r[2].val() || {};
      const ids = Object.keys(enr).filter(function (id) { return comps[id]; });
      let videos = 0, exams = 0, scoreSum = 0, scoreN = 0, pctSum = 0;
      const rows = ids.map(function (id) {
        const lessons = comps[id].lessons || {}, p = prog[id] || {};
        const pct = computeCourseProgress(lessons, p);
        pctSum += pct;
        Object.keys(p).forEach(function (lid) {
          const lp = p[lid] || {};
          Object.keys(lp.videos || {}).forEach(function (v) { if (lp.videos[v].watched) videos++; });
          Object.keys(lp.exams || {}).forEach(function (e) {
            const x = lp.exams[e]; if (x.completed) { exams++; if (x.totalQuestions) { scoreSum += x.score / x.totalQuestions * 100; scoreN++; } }
          });
        });
        return { title: comps[id].title || 'كورس', pct: pct };
      });
      const total = ids.length ? Math.round(pctSum / ids.length) : 0;
      document.getElementById('lvPct').textContent = total + '%';
      requestAnimationFrame(function () { document.getElementById('lvFill').style.height = total + '%'; });
      document.getElementById('lvNext').textContent = ids.length ? (total >= 100 ? 'خلصت كل المحتوى، ممتاز' : 'كمّل مذاكرتك، باقي ' + (100 - total) + '% لإنهاء كل كورساتك') : 'لسه ما اشتركتش في أي كورس';

      const stat = function (num, label, ic) {
        return '<div class="stat-card"><div class="stat-info"><div class="stat-num">' + num + '</div><div class="stat-label">' + label + '</div></div>' +
          '<div class="stat-icon completed">' + icon(ic, 'icon-md') + '</div></div>';
      };
      document.getElementById('statsGrid').innerHTML =
        stat(ids.length, 'كورس مشترك فيه', 'bookOpen') +
        stat(videos, 'فيديو تمت مشاهدته', 'play') +
        stat(exams, 'اختبار تم حله', 'listCheck') +
        stat((scoreN ? Math.round(scoreSum / scoreN) : 0) + '%', 'متوسط نتائج الاختبارات', 'chartSimple');

      document.getElementById('courseBars').innerHTML = rows.length ? rows.map(function (x) {
        return '<div style="background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow);"><h4 style="margin:0 0 10px; color:var(--text);">' + escapeHtml(x.title) + '</h4>' +
          '<div class="card-progress-wrap"><div class="card-progress-bar"><div class="card-progress-fill" style="width:' + x.pct + '%;"></div></div><span class="card-progress-pct">' + x.pct + '%</span></div></div>';
      }).join('') : '<div class="empty-state"><p>اشترك في كورس علشان يظهر تقدمك هنا</p></div>';
    });
  });
</script>
</body>
</html>
