<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("asb_theme")||"light")</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>الرئيسية — منصة د.علاء صبح</title>
<link rel="stylesheet" href="style.css?v=11">
<link rel="stylesheet" href="theme.css?v=3">
<link rel="stylesheet" href="shell.css?v=2">
<style>
/* الصفحة الرئيسية — تصميم جديد بالكامل، كل الكلاسات بادئة بـ hm- */
.hm{max-width:1180px;margin:0 auto;padding:6px 0 24px}
.hm *{box-sizing:border-box}
.hm .icon{width:18px;height:18px}
.hm-card{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)}

/* ===== البانر الترحيبي ===== */
.hm-hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:28px;padding:34px 36px;border-radius:26px;color:#fff;background:var(--gradient-primary);box-shadow:var(--shadow-lift)}
.hm-hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(circle at 8% 115%,rgba(52,211,168,.32),transparent 42%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 24px)}
.hm-hero>*{position:relative}
.hm-hi{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);font-size:13px;font-weight:700}
.hm-hi .icon{color:var(--teal-light);width:15px;height:15px}
.hm-h1{margin:14px 0 8px;font-family:'Cairo',sans-serif;font-weight:800;font-size:clamp(25px,4vw,38px);line-height:1.35;color:#fff}
.hm-h1 span{color:var(--teal-light)}
.hm-sub{margin:0 0 22px;max-width:520px;font-size:15px;line-height:1.9;color:rgba(255,255,255,.8)}
.hm-cta{display:flex;flex-wrap:wrap;gap:12px}
.hm-btn{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border:0;border-radius:999px;font:inherit;font-size:15px;font-weight:800;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
.hm-btn:hover{transform:translateY(-2px)}
.hm-btn.go{background:var(--gradient-gold);color:#04251D;box-shadow:0 10px 26px rgba(15,159,130,.45)}
.hm-btn.ghost{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.28);color:#fff}
.hm-ring{position:relative;flex-shrink:0;width:158px;height:158px}
.hm-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hm-ring circle{fill:none;stroke-width:9}
.hm-ring .bg{stroke:rgba(255,255,255,.16)}
.hm-ring .fg{stroke:var(--teal-light);stroke-linecap:round;stroke-dasharray:408;stroke-dashoffset:408;transition:stroke-dashoffset 1.1s ease}
.hm-ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hm-ring b{font-family:'Cairo',sans-serif;font-size:34px;font-weight:800;line-height:1}
.hm-ring small{margin-top:6px;font-size:12px;font-weight:700;color:rgba(255,255,255,.75)}

/* ===== الإحصائيات ===== */
.hm-dash{margin-top:22px}
.hm-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.hm-kpi{display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;background:var(--card-bg);border:1px solid var(--border);box-shadow:var(--shadow)}
.hm-kico{flex-shrink:0;width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.hm-kico .icon{width:25px;height:25px}
.hm-kico.a{background:var(--teal-pale);color:var(--teal-dark)}
.hm-kico.b{background:var(--primary-tint);color:var(--primary-light)}
.hm-kico.c{background:#EFE9FF;color:#6A4DE0}
:root[data-theme="dark"] .hm-kico.a{color:var(--teal)}
:root[data-theme="dark"] .hm-kico.c{background:#241B45;color:#A99BFF}
.hm-kpi b{display:block;font-family:'Cairo',sans-serif;font-size:30px;font-weight:800;line-height:1.1;color:var(--text)}
.hm-kpi span{font-size:13.5px;font-weight:700;color:var(--text-muted)}

/* ===== النشاط الأسبوعي ===== */
.hm-act{margin-top:16px;padding:22px 24px 18px}
.hm-act-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.hm-act-h h3{margin:0;font-size:17px;font-weight:800;color:var(--text)}
.hm-leg{display:flex;gap:16px;font-size:12.5px;font-weight:700;color:var(--text-muted)}
.hm-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.hm-leg .p i{background:var(--cream-deep)}.hm-leg .c i{background:linear-gradient(180deg,var(--teal),var(--primary-light))}
.hm-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:150px;padding-bottom:2px;border-bottom:1px dashed var(--border)}
.hm-day{display:flex;align-items:flex-end;justify-content:center;gap:5px;height:100%}
.hm-bar{width:min(22px,38%);min-height:4px;border-radius:7px 7px 3px 3px;height:0;transition:height .8s ease}
.hm-bar.p{background:var(--cream-deep)}
.hm-bar.c{background:linear-gradient(180deg,var(--teal),var(--primary-light))}
.hm-days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:10px;text-align:center;font-size:12px;font-weight:700;color:var(--text-muted)}
.hm-days .today{color:var(--primary-light);font-weight:800}
:root[data-theme="dark"] .hm-days .today{color:var(--primary)}
.hm-foot{margin:14px 0 0;font-size:13px;color:var(--text-muted);font-weight:600}

/* ===== المحتوى ===== */
.hm-head{display:flex;align-items:center;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;margin:34px 0 18px}
.hm-head h2{margin:0;font-family:'Cairo',sans-serif;font-size:22px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:12px}
.hm-head h2::before{content:"";width:6px;height:26px;border-radius:6px;background:linear-gradient(180deg,var(--teal),var(--primary-light))}
.hm-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hm-search{position:relative}
.hm-search .icon{position:absolute;top:50%;right:14px;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted);pointer-events:none}
.hm-search input{width:230px;padding:10px 40px 10px 14px;font:inherit;font-size:14px;border-radius:999px}
.hm-tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--card-bg);border:1px solid var(--border)}
.hm-tab{padding:8px 18px;border:0;border-radius:999px;background:none;font:inherit;font-size:13.5px;font-weight:800;color:var(--text-muted);cursor:pointer;transition:.15s}
.hm-tab.on{background:var(--gradient-primary);color:#fff}
.hm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:20px}
.hm-c{display:flex;flex-direction:column;overflow:hidden;border-radius:22px;background:var(--card-bg);border:1px solid var(--border);box-shadow:var(--shadow);text-decoration:none;color:var(--text);transition:transform .2s,box-shadow .2s}
.hm-c:hover{transform:translateY(-5px);box-shadow:var(--shadow-lift)}
.hm-cv{position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:var(--gradient-primary);color:rgba(255,255,255,.5)}
.hm-cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.hm-c:hover .hm-cv img{transform:scale(1.05)}
.hm-cv .icon{width:44px;height:44px}
.hm-cv::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,14,31,.45),transparent 50%)}
.hm-tag{position:absolute;z-index:2;top:12px;right:12px;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(5,14,31,.7);color:#fff;font-size:12px;font-weight:800;backdrop-filter:blur(6px)}
.hm-tag .icon{width:13px;height:13px}
.hm-new{position:absolute;z-index:2;top:12px;left:12px;display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;background:var(--gradient-gold);color:#04251D;font-size:12px;font-weight:800}
.hm-new .icon{width:12px;height:12px}
.hm-cb{display:flex;flex-direction:column;flex:1;padding:18px 20px 20px}
.hm-st{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:4px 11px;border-radius:999px;background:var(--primary-tint);color:var(--primary-light);font-size:12px;font-weight:800}
.hm-st.on{background:var(--teal-pale);color:var(--teal-dark)}
:root[data-theme="dark"] .hm-st.on{color:var(--teal)}
.hm-st .icon{width:13px;height:13px}
.hm-cb h3{margin:0 0 6px;font-size:17px;font-weight:800;line-height:1.55}
.hm-cb p{margin:0 0 12px;font-size:13.5px;line-height:1.85;color:var(--text-muted)}
.hm-meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:14px;font-size:12.5px;font-weight:700;color:var(--text-muted)}
.hm-meta span{display:inline-flex;align-items:center;gap:6px}
.hm-meta .icon{width:14px;height:14px;color:var(--teal)}
.hm-pr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hm-pb{flex:1;height:8px;border-radius:999px;background:var(--cream-deep);overflow:hidden}
.hm-pb i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary-light),var(--teal))}
.hm-pr span{font-size:13px;font-weight:800}
.hm-go{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;font-size:14.5px;font-weight:800;background:var(--gradient-primary);color:#fff}
.hm-go.out{background:none;border:1.5px solid var(--border);color:var(--primary)}
:root[data-theme="dark"] .hm-go.out{color:var(--primary)}
.hm-go .icon{width:15px;height:15px}
.hm-empty{text-align:center;padding:56px 16px;border-radius:22px;border:1.5px dashed var(--border);color:var(--text-muted);font-size:15px;font-weight:700}
.hm-empty .icon{display:block;margin:0 auto 12px;width:38px;height:38px;color:var(--teal)}
.hm-empty button{margin-top:14px;padding:10px 22px;border:0;border-radius:999px;background:var(--gradient-primary);color:#fff;font:inherit;font-weight:800;cursor:pointer}
.hm-err{border-color:var(--danger);color:var(--danger)}.hm-err .icon{color:var(--danger)}
.hm-sk{height:330px;border-radius:22px;background:linear-gradient(100deg,var(--card-bg) 30%,var(--cream) 50%,var(--card-bg) 70%);background-size:300% 100%;border:1px solid var(--border);animation:hmsk 1.4s linear infinite}
@keyframes hmsk{from{background-position:100% 0}to{background-position:0 0}}

@media (max-width:820px){
  .hm-hero{flex-direction:column-reverse;align-items:flex-start;padding:26px 22px;gap:20px}
  .hm-ring{width:120px;height:120px;align-self:center}.hm-ring b{font-size:27px}
  .hm-kpis{grid-template-columns:1fr}
  .hm-kpi{padding:16px}
  .hm-head{margin-top:28px}
  .hm-tools{width:100%}.hm-search{flex:1;min-width:150px}.hm-search input{width:100%}
}
@media (max-width:480px){
  .hm-btn{flex:1;justify-content:center;padding:13px 16px}
  .hm-bars,.hm-days{gap:5px}
  .hm-tabs{width:100%}.hm-tab{flex:1;padding:8px 6px}
}
@media (prefers-reduced-motion:reduce){.hm *{transition:none!important;animation:none!important}}
</style>

<body>

<header class="nv" id="appHeader"></header>

<main class="page"><div class="hm">

  <section class="hm-hero">
    <div class="hm-txt">
      <span class="hm-hi" id="hmHi"></span>
      <h1 class="hm-h1" id="hmH1">أهلاً بيك</h1>
      <p class="hm-sub" id="hmSub">اختار كورسك وابدأ رحلتك مع د.علاء صبح.</p>
      <div class="hm-cta" id="hmCta"></div>
    </div>
    <div class="hm-ring" id="hmRing" style="display:none" title="نسبة إنجازك في كورساتك">
      <svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="65"/><circle class="fg" id="hmRingFg" cx="75" cy="75" r="65"/></svg>
      <div><b id="hmPct">0%</b><small>إنجازك</small></div>
    </div>
  </section>

  <section class="hm-dash" id="dashboardSection" style="display:none">
    <div class="hm-kpis">
      <div class="hm-kpi"><span class="hm-kico a" id="iconCompleted"></span><div><b id="statCompleted">0</b><span>كورسات مكتملة</span></div></div>
      <div class="hm-kpi"><span class="hm-kico b" id="iconCurrent"></span><div><b id="statCurrent">0</b><span>كورسات حالية</span></div></div>
      <div class="hm-kpi"><span class="hm-kico c" id="iconVideos"></span><div><b id="statVideos">0</b><span>فيديوهات تمت مشاهدتها</span></div></div>
    </div>
    <div class="hm-card hm-act">
      <div class="hm-act-h"><h3>نشاطي التعليمي</h3>
        <div class="hm-leg"><span class="p"><i></i>الأسبوع الماضي</span><span class="c"><i></i>الأسبوع الحالي</span></div></div>
      <div class="hm-bars" id="hmBars"></div>
      <div class="hm-days" id="activityDays"></div>
      <p class="hm-foot" id="hmFoot"></p>
    </div>
  </section>

  <div class="hm-head" id="coursesSection">
    <h2>المحتوى التعليمي</h2>
    <div class="hm-tools">
      <label class="hm-search"><span id="iconSearch"></span><input type="search" id="searchInput" placeholder="ابحث عن كورس..." autocomplete="off"></label>
      <div class="hm-tabs" id="filterTabs">
        <button type="button" class="hm-tab" data-filter="mine" style="display:none">كورساتي</button>
        <button type="button" class="hm-tab" data-filter="course">الكورسات</button>
        <button type="button" class="hm-tab on" data-filter="all">الكل</button>
      </div>
    </div>
  </div>

  <div id="content"><div class="hm-grid"><div class="hm-sk"></div><div class="hm-sk"></div><div class="hm-sk"></div></div></div>
</div></main>

<footer class="ft" id="siteFooter"></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=12"></script>
<script src="icons.js?v=3"></script>
<script src="app-shell.js?v=9"></script>
<script>
(function () {
  const content = document.getElementById('content');
  let currentFilter = 'all', searchQuery = '', cachedFiltered = {}, cachedEnrolls = {}, cachedProgress = {};
  const $ = function (id) { return document.getElementById(id); };

  $('iconCompleted').innerHTML = icon('circleCheck'); $('iconCurrent').innerHTML = icon('fire');
  $('iconVideos').innerHTML = icon('video'); $('iconSearch').innerHTML = icon('search');

  function truncateText(t, m) { return (!t || t.length <= m) ? t : t.slice(0, m).trim() + '…'; }

  /* ===== البانر الترحيبي ===== */
  function renderHero(ud, filtered, enrolls, progress, overallPct) {
    const first = ((ud.name || '').trim().split(/\s+/)[0]) || 'يا بطل';
    $('hmHi').innerHTML = icon('graduationCap') + (ud.centerName ? 'سنتر ' + escapeHtml(ud.centerName) : 'طالب المنصة');
    $('hmH1').innerHTML = 'أهلاً يا <span>' + escapeHtml(first) + '</span> 👋';
    const mine = Object.keys(enrolls).filter(function (id) { return filtered[id]; });
    let next = null;
    mine.forEach(function (id) { if (!next) { const p = computeCourseProgress(filtered[id].lessons || {}, progress[id] || {}); if (p < 100) next = { id: id, c: filtered[id], p: p }; } });
    if (!mine.length) {
      $('hmSub').textContent = 'اختار كورسك من الأسفل وابدأ رحلتك مع د.علاء صبح، وكل خطوة بتتسجّل لك.';
      $('hmCta').innerHTML = '<button type="button" class="hm-btn go" id="hmStart">' + icon('bookOpen') + ' تصفّح الكورسات</button>';
    } else if (next) {
      $('hmSub').textContent = 'كمّل من حيث وقفت في «' + (next.c.title || 'كورسك') + '»، وخلّي إنجازك مستمر.';
      $('hmCta').innerHTML = '<a class="hm-btn go" href="competition.html?id=' + encodeURIComponent(next.id) + '">' + icon('video') + ' كمّل التعلم</a>' +
        '<button type="button" class="hm-btn ghost" id="hmStart">كل المحتوى</button>';
    } else {
      $('hmSub').textContent = 'ما شاء الله! خلّصت كل كورساتك. تقدر تراجع محتواك أو تتصفح كورسات جديدة.';
      $('hmCta').innerHTML = '<button type="button" class="hm-btn go" id="hmStart">' + icon('bookOpen') + ' استعرض المحتوى</button>';
    }
    const st = $('hmStart'); if (st) st.onclick = function () { $('coursesSection').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    if (mine.length) {
      $('hmRing').style.display = '';
      $('hmPct').textContent = overallPct + '%';
      requestAnimationFrame(function () { $('hmRingFg').style.strokeDashoffset = 408 - 408 * overallPct / 100; });
    }
  }

  /* ===== الإحصائيات + النشاط الأسبوعي ===== */
  function renderDashboardStats(filtered, enrolls, progress) {
    const section = $('dashboardSection');
    const ids = Object.keys(enrolls).filter(function (id) { return filtered[id]; });
    let completed = 0, current = 0, videos = 0, totalL = 0, doneL = 0;
    const stamps = [];
    ids.forEach(function (id) {
      const lessons = filtered[id].lessons || {}, cp = progress[id] || {};
      if (computeCourseProgress(lessons, cp) >= 100) completed++; else current++;
      Object.keys(lessons).forEach(function (lid) {
        totalL++; const lp = cp[lid] || {};
        if (lp.completed) doneL++;
        Object.keys(lp.videos || {}).forEach(function (v) { if (lp.videos[v] && lp.videos[v].watched) videos++; });
        Object.keys(lp.exams || {}).forEach(function (e) { const x = lp.exams[e]; if (x && x.answeredAt) stamps.push(x.answeredAt); });
      });
    });
    const overall = totalL ? Math.round(doneL / totalL * 100) : 0;
    renderHero(window.__ud, filtered, enrolls, progress, overall);
    if (!ids.length) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    $('statCompleted').textContent = completed; $('statCurrent').textContent = current; $('statVideos').textContent = videos;

    const LABELS = ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
    const sat = function (d) { return (d.getDay() + 1) % 7; };
    const now = new Date(), today = sat(now);
    const start = new Date(now); start.setHours(0, 0, 0, 0); start.setDate(now.getDate() - today);
    const prevStart = new Date(start); prevStart.setDate(start.getDate() - 7);
    const cur = [0, 0, 0, 0, 0, 0, 0], prev = [0, 0, 0, 0, 0, 0, 0];
    stamps.forEach(function (ts) { const d = new Date(ts), i = sat(d); if (d >= start) cur[i]++; else if (d >= prevStart) prev[i]++; });
    const max = Math.max(1, Math.max.apply(null, cur), Math.max.apply(null, prev));
    $('hmBars').innerHTML = LABELS.map(function (l, i) {
      return '<div class="hm-day"><i class="hm-bar p" data-h="' + prev[i] / max * 100 + '" title="' + l + ' (الماضي): ' + prev[i] + '"></i><i class="hm-bar c" data-h="' + cur[i] / max * 100 + '" title="' + l + ' (الحالي): ' + cur[i] + '"></i></div>';
    }).join('');
    requestAnimationFrame(function () { document.querySelectorAll('.hm-bar').forEach(function (b) { b.style.height = (+b.dataset.h || 0) + '%'; }); });
    $('activityDays').innerHTML = LABELS.map(function (l, i) { return '<span' + (i === today ? ' class="today"' : '') + '>' + l + '</span>'; }).join('');
    $('hmFoot').textContent = stamps.length ? 'نشاطك في حل الاختبارات خلال آخر أسبوعين' : 'ابدأ أول اختبار عشان نقدر نعرض بيانات نشاطك التعليمي بشكل دقيق';
  }

  function showError(msg) {
    content.innerHTML = '<div class="hm-empty hm-err">' + icon('circleXmark') + msg + '<br><button type="button" onclick="location.reload()">إعادة المحاولة</button></div>';
  }

  /* ===== الكروت ===== */
  function renderCompetitions(data, enrolls, progress) {
    const all = Object.keys(data), q = searchQuery.trim().toLowerCase();
    const ids = all.filter(function (id) {
      const c = data[id];
      if (currentFilter === 'mine') { if (!enrolls || !enrolls[id]) return false; }
      else if (currentFilter === 'course') { if (c.type === 'competition') return false; }
      if (q && ((c.title || '') + ' ' + (c.description || '')).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    if (!all.length) { content.innerHTML = '<div class="hm-empty">' + icon('trophy') + 'لا يوجد محتوى متاح حاليًا، تابعنا قريبًا</div>'; return; }
    if (!ids.length) {
      content.innerHTML = q
        ? '<div class="hm-empty">' + icon('search') + 'لا يوجد نتائج بحث تطابق «' + escapeHtml(searchQuery.trim()) + '»<br><button type="button" id="clrQ">مسح البحث</button></div>'
        : '<div class="hm-empty">' + icon('circleInfo') + (currentFilter === 'mine' ? 'لسه ما اشتركتش في أي كورس' : 'لا يوجد محتوى من هذا النوع حاليًا') + '</div>';
      const b = $('clrQ'); if (b) b.onclick = function () { searchQuery = ''; $('searchInput').value = ''; renderCompetitions(cachedFiltered, cachedEnrolls, cachedProgress); };
      return;
    }
    content.innerHTML = '<div class="hm-grid">' + ids.map(function (id) {
      const c = data[id], lessons = c.lessons || {}, n = Object.keys(lessons).length;
      const isCourse = c.type !== 'competition', ti = isCourse ? 'bookOpen' : 'trophy', on = !!enrolls[id];
      const pct = on ? computeCourseProgress(lessons, progress[id] || {}) : 0;
      const isNew = c.createdAt && (Date.now() - c.createdAt) < 7 * 864e5, img = c.coverUrl || c.image;
      return '<a class="hm-c" href="competition.html?id=' + encodeURIComponent(id) + '">' +
        '<div class="hm-cv">' + (img ? '<img src="' + escapeHtml(img) + '" alt="" loading="lazy">' : icon(ti)) +
          '<span class="hm-tag">' + icon(ti) + (isCourse ? 'كورس' : 'مسابقة') + '</span>' + (isNew ? '<span class="hm-new">' + icon('star') + 'جديد</span>' : '') + '</div>' +
        '<div class="hm-cb"><span class="hm-st' + (on ? ' on' : '') + '">' + (on ? icon('circleCheck') + 'أنت مشترك بالفعل' : icon('gem') + (isCourse ? 'كورس مجاني' : 'مسابقة مجانية')) + '</span>' +
          '<h3>' + escapeHtml(c.title || 'بدون عنوان') + '</h3>' +
          (c.description ? '<p>' + escapeHtml(truncateText(c.description, 80)) + '</p>' : '') +
          '<div class="hm-meta"><span>' + icon('bookOpen') + n + ' محاضرة</span>' +
            (c.instructorName ? '<span>' + icon('graduationCap') + escapeHtml(c.instructorName) + '</span>' : '<span>' + icon('calendar') + (isNew ? 'أُضيف حديثًا' : 'متاح الآن') + '</span>') + '</div>' +
          (on ? '<div class="hm-pr"><div class="hm-pb"><i style="width:' + pct + '%"></i></div><span>' + pct + '%</span></div>' : '') +
          '<span class="hm-go' + (on ? ' out' : '') + '">' + (on ? 'متابعة التعلم' : (isCourse ? 'اشتراك في الكورس' : 'انضمام للمسابقة')) + icon('chevronLeft') + '</span>' +
        '</div></a>';
    }).join('') + '</div>';
  }

  function syncFilterTabs(enrolls, all) {
    const has = Object.keys(enrolls || {}).some(function (id) { return all[id]; });
    document.querySelector('.hm-tab[data-filter="mine"]').style.display = has ? '' : 'none';
    document.querySelector('.hm-tab[data-filter="all"]').style.display = has ? 'none' : '';
    if (has && currentFilter === 'all') currentFilter = 'mine';
    if (!has && currentFilter === 'mine') currentFilter = 'all';
    document.querySelectorAll('.hm-tab').forEach(function (b) { b.classList.toggle('on', b.dataset.filter === currentFilter); });
  }
  $('filterTabs').addEventListener('click', function (e) {
    const b = e.target.closest('.hm-tab'); if (!b) return;
    currentFilter = b.dataset.filter;
    document.querySelectorAll('.hm-tab').forEach(function (x) { x.classList.toggle('on', x === b); });
    renderCompetitions(cachedFiltered, cachedEnrolls, cachedProgress);
  });
  $('searchInput').addEventListener('input', function () { searchQuery = this.value; renderCompetitions(cachedFiltered, cachedEnrolls, cachedProgress); });
  const initialQuery = new URLSearchParams(location.search).get('q');
  if (initialQuery) { searchQuery = initialQuery; $('searchInput').value = initialQuery; }

  /* ===== بدء التشغيل ===== */
  auth.onAuthStateChanged(function (user) {
    if (!user) { window.location.href = 'index.html'; return; }
    AttGuard.userSnap(user.uid).then(function (snap) {
      const ud = snap.val();
      if (!ud || !ud.name) { window.location.href = 'register.html'; return Promise.reject(new Error('redirect')); }
      window.__ud = ud;
      if (ud.blocked === true) { AttGuard.show(user.uid, ud); return Promise.reject(new Error('blocked')); }
      renderAppHeader(user, ud, { showPoints: true });
      renderFooter();
      return Promise.all([db.ref('competitions').once('value'), db.ref('userEnrollments/' + user.uid).once('value'), db.ref('userProgress/' + user.uid).once('value')]);
    }).then(function (r) {
      const allData = r[0].val() || {}, enrolls = r[1].val() || {}, progress = r[2].val() || {}, filtered = {};
      Object.keys(allData).forEach(function (id) {
        const comp = allData[id], lessons = comp.lessons || {};
        const has = Object.keys(lessons).some(function (lid) { const l = lessons[lid] || {}; return (l.videos && Object.keys(l.videos).length) || (l.exams && Object.keys(l.exams).length) || (l.pdfs && Object.keys(l.pdfs).length); });
        if (has && isCourseVisibleForUser(comp, window.__ud)) filtered[id] = comp;
      });
      cachedFiltered = filtered; cachedEnrolls = enrolls; cachedProgress = progress;
      syncFilterTabs(enrolls, filtered);
      renderCompetitions(filtered, enrolls, progress);
      renderDashboardStats(filtered, enrolls, progress);
      if (initialQuery) setTimeout(function () { $('coursesSection').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 200);
    }).catch(function (err) {
      if (err && (err.message === 'redirect' || err.message === 'blocked')) return;
      console.error('خطأ في تحميل المحتوى:', err);
      showError('تعذر تحميل المحتوى: ' + (err.message || 'خطأ غير معروف'));
    });
  });
})();
</script>
<script src="mobile-app.js?v=1"></script>
</body>
</html>
