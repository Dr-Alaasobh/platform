<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("asb_theme")||"light")</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>الكورسات — منصة د.علاء صبح</title>
<link rel="stylesheet" href="style.css?v=11">
<link rel="stylesheet" href="theme.css?v=3">
<link rel="stylesheet" href="shell.css?v=1">
<link rel="stylesheet" href="pages.css?v=1">
</head>
<body>
<header class="nv" id="appHeader"></header>
<main class="sp">
  <section class="sp-hero"><div><h1 id="gName">أهلًا بك 👋</h1><p id="gSub">اختر كورسك وكمّل رحلتك</p></div>
    <div class="sp-mini" id="mini"></div></section>
  <div id="resume"></div>
  <div class="sp-sec"><h2>الكورسات</h2><div class="sp-tabs" id="tabs"><button class="sp-tab" data-f="mine" style="display:none">كورساتي</button><button class="sp-tab" data-f="new">متاحة للاشتراك</button><button class="sp-tab on" data-f="all">الكل</button></div></div>
  <input type="hidden" id="searchInput">
  <div class="sp-g" id="content"><div class="sp-empty">جاري التحميل...</div></div>
</main>
<footer class="ft" id="siteFooter"></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=10"></script>
<script src="icons.js?v=3"></script>
<script src="app-shell.js?v=7"></script>
<script>
(function(){
 var $=function(i){return document.getElementById(i)},F='all',Q='',D={},EN={},PR={};
 function ini(c){return escapeHtml((c.title||'?').trim().charAt(0))}
 function draw(){
  var ids=Object.keys(D).filter(function(id){var c=D[id];
   if(F==='mine'&&!EN[id])return false;if(F==='new'&&EN[id])return false;
   if(Q&&((c.title||'')+' '+(c.description||'')).toLowerCase().indexOf(Q)<0)return false;return true});
  if(!ids.length){$('content').innerHTML='<div class="sp-empty">'+icon(Q?'search':'circleInfo','icon-xl')+'<p>'+(Q?'لا توجد نتائج تطابق بحثك':F==='mine'?'لسه ما اشتركتش في أي كورس':'لا يوجد محتوى حاليًا')+'</p>'+(Q?'<button class="btn btn-outline btn-sm" id="clr" style="width:auto">مسح البحث</button>':'')+'</div>';
   var b=$('clr');if(b)b.onclick=function(){Q='';$('searchInput').value='';draw()};return}
  $('content').innerHTML=ids.map(function(id){var c=D[id],L=c.lessons||{},n=Object.keys(L).length,en=!!EN[id],p=en?computeCourseProgress(L,PR[id]||{}):0,
   nw=c.createdAt&&Date.now()-c.createdAt<6048e5,img=c.coverUrl||c.image;
   return '<a class="sp-c" href="competition.html?id='+encodeURIComponent(id)+'"><div class="sp-cv">'+(img?'<img loading="lazy" alt="" src="'+escapeHtml(img)+'">':'<span class="ini">'+ini(c)+'</span>')+
   '<span class="sp-bg">'+(en?icon('circleCheck','icon-sm')+' مشترك':icon('gem','icon-sm')+' مجاني')+'</span>'+(nw?'<span class="sp-bg new">'+icon('star','icon-sm')+' جديد</span>':'')+'</div>'+
   '<div class="sp-cb"><h3>'+escapeHtml(c.title||'بدون عنوان')+'</h3><p>'+escapeHtml(c.description?c.description.slice(0,80):'')+'</p>'+
   '<div class="sp-mt"><span>'+icon('bookOpen','icon-sm')+' '+n+' محاضرة</span>'+(c.instructorName?'<span>'+icon('graduationCap','icon-sm')+' '+escapeHtml(c.instructorName)+'</span>':'')+'</div>'+
   (en?'<div class="sp-pr"><div class="sp-pb"><i style="width:'+p+'%"></i></div><b>'+p+'%</b></div>':'')+
   '<span class="sp-cta '+(en?'o':'')+'">'+(en?'متابعة التعلم':'اشتراك في الكورس')+'</span></div></a>'}).join('')}
 function stats(){
  var ids=Object.keys(EN).filter(function(i){return D[i]}),done=0,vid=0,best=null;
  ids.forEach(function(i){var p=computeCourseProgress(D[i].lessons||{},PR[i]||{});if(p>=100)done++;else if(!best||p>best.p)best={id:i,p:p};
   Object.values(PR[i]||{}).forEach(function(l){Object.values((l&&l.videos)||{}).forEach(function(v){if(v&&v.watched)vid++})})});
  $('mini').innerHTML=ids.length?'<div><b>'+ids.length+'</b><small>كورساتي</small></div><div><b>'+done+'</b><small>مكتملة</small></div><div><b>'+vid+'</b><small>فيديو شاهدته</small></div>':'';
  if(best)$('resume').innerHTML='<a class="sp-resume" href="competition.html?id='+encodeURIComponent(best.id)+'"><div><small>كمّل من حيث توقفت</small><h3>'+escapeHtml(D[best.id].title||'')+'</h3><div class="sp-pr"><div class="sp-pb"><i style="width:'+best.p+'%"></i></div><b>'+best.p+'%</b></div></div><span class="btn btn-primary btn-sm" style="width:auto">متابعة '+icon('chevronLeft','icon-sm')+'</span></a>'}
 $('tabs').onclick=function(e){var b=e.target.closest('.sp-tab');if(!b)return;F=b.dataset.f;document.querySelectorAll('.sp-tab').forEach(function(x){x.classList.toggle('on',x===b)});draw()};
 $('searchInput').addEventListener('input',function(){Q=this.value.trim().toLowerCase();draw()});
 var q0=new URLSearchParams(location.search).get('q');if(q0){Q=q0.toLowerCase();$('searchInput').value=q0}
 auth.onAuthStateChanged(function(user){
  if(!user){location.href='index.html';return}
  db.ref('users/'+user.uid).once('value').then(function(s){var u=s.val();
   if(!u||!u.name){location.href='register.html';return Promise.reject(new Error('redirect'))}
   window.__ud=u;if(u.blocked===true){alert('تم إيقاف حسابك من المنصة. تواصل مع المسئول.');auth.signOut().then(function(){location.href='index.html'});return Promise.reject(new Error('blocked'))}
   renderAppHeader(user,u,{showPoints:true});renderFooter();
   $('gName').textContent='أهلًا يا '+u.name.trim()+' 👋';$('gSub').textContent='طالب سنتر '+(u.centerName||'');
   return Promise.all([db.ref('competitions').once('value'),db.ref('userEnrollments/'+user.uid).once('value'),db.ref('userProgress/'+user.uid).once('value')])})
  .then(function(r){if(!r)return;var all=r[0].val()||{};EN=r[1].val()||{};PR=r[2].val()||{};
   Object.keys(all).forEach(function(id){var L=all[id].lessons||{},has=Object.values(L).some(function(l){return ['videos','exams','pdfs'].some(function(k){return l[k]&&Object.keys(l[k]).length})});
    if(has&&isCourseVisibleForUser(all[id],window.__ud))D[id]=all[id]});
   var has=Object.keys(EN).some(function(i){return D[i]});
   document.querySelector('[data-f=mine]').style.display=has?'':'none';document.querySelector('[data-f=all]').style.display=has?'none':'';
   if(has&&F==='all')F='mine';document.querySelectorAll('.sp-tab').forEach(function(x){x.classList.toggle('on',x.dataset.f===F)});
   stats();draw()})
  .catch(function(e){if(e&&(e.message==='redirect'||e.message==='blocked'))return;console.error(e);$('content').innerHTML='<div class="sp-empty"><p>تعذر تحميل المحتوى</p><button class="btn btn-primary btn-sm" style="width:auto" onclick="location.reload()">إعادة المحاولة</button></div>'})
 })})();
</script>
</body>
</html>
