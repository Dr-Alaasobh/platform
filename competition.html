<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("asb_theme")||"light")</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>تفاصيل المحتوى — منصة د.علاء صبح</title>
<link rel="stylesheet" href="style.css?v=2">
<!-- Font Awesome للأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  /* إضافة دعم للأسطر الجديدة في النصوص */
  .preserve-linebreaks {
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .chv-info-card p {
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .accordion-body .content-item .ci-left {
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .enroll-lock-card p {
    white-space: pre-wrap;
    word-wrap: break-word;
  }
</style>
</head>
<body>

<header class="app-header" id="appHeader"></header>

<main class="page">
  <a class="back-link" href="home.html">
    <i class="fas fa-arrow-right"></i> كل المحتوى
  </a>

  <div id="courseHero"></div>

  <h2 style="font-family:'Amiri',serif; color:var(--primary-dark); font-size:19px; margin:0 0 14px;">
    <i class="fas fa-book-open" style="color:var(--teal);"></i> المحاضرات
  </h2>

  <div id="lessonsWrap">
    <div class="center-loading"><div class="loader"></div></div>
  </div>
</main>

<!-- نافذة الوصف الكامل -->
<div class="modal-overlay" id="descModal">
  <div class="modal">
    <button class="modal-close" id="closeDescModal">
      <i class="fas fa-times"></i>
    </button>
    <h3 id="descModalTitle" style="font-family:'Amiri',serif; color:var(--primary-dark);"></h3>
    <p id="descModalBody" style="font-size:14px; line-height:1.8; color:var(--text); white-space:pre-wrap; word-wrap:break-word;"></p>
  </div>
</div>

<!-- نافذة تأكيد الاشتراك -->
<div class="modal-overlay" id="subscribeModal">
  <div class="modal" style="max-width:400px; text-align:center;">
    <h3 id="subscribeModalTitle" style="font-family:'Amiri',serif; color:var(--primary-dark);">تأكيد الاشتراك</h3>
    <p id="subscribeModalBody" style="font-size:14px; line-height:1.8; color:var(--text); margin:0 0 22px; white-space:pre-wrap; word-wrap:break-word;">هل تريد تأكيد الاشتراك؟</p>
    <div style="display:flex; gap:10px;">
      <button type="button" class="btn btn-primary" id="confirmSubscribeBtn" style="flex:1;">نعم</button>
      <button type="button" class="btn btn-outline" id="cancelSubscribeBtn" style="flex:1;">لا</button>
    </div>
  </div>
</div>

<footer class="site-footer" id="siteFooter"></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js?v=2"></script>
<script src="app-shell.js?v=4"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const compId = params.get('id');
  if (!compId) window.location.href = 'home.html';

  let compData = null;
  let progressData = {};
  let isEnrolled = false;
  let currentUser = null;

  requireAuth(function (user, userData) {
    currentUser = user;
    window.__ud = userData;
    renderAppHeader(user, userData, { showPoints: true });
    renderFooter();

    db.ref('userProgress/' + user.uid + '/' + compId).on('value', function (snap) {
      progressData = snap.val() || {};
      if (compData) render();
    });

    db.ref('userEnrollments/' + user.uid + '/' + compId).on('value', function (snap) {
      isEnrolled = snap.exists();
      if (compData) render();
    });

    db.ref('competitions/' + compId).on('value', function (snap) {
      if (!snap.exists()) { window.location.href = 'home.html'; return; }
      compData = snap.val();
      if (window.__ud && !isCourseVisibleForUser(compData, window.__ud)) { window.location.href = 'home.html'; return; }
      render();
    });
  });

  function render() {
    renderHero();
    renderLessons();
  }

  /* ===== الاشتراك ===== */
  function subscribe() {
    const now = firebase.database.ServerValue.TIMESTAMP;
    const updates = {};
    updates['enrollments/' + compId + '/' + currentUser.uid] = now;
    updates['userEnrollments/' + currentUser.uid + '/' + compId] = now;
    return db.ref().update(updates);
  }

  document.getElementById('cancelSubscribeBtn').addEventListener('click', function () {
    document.getElementById('subscribeModal').classList.remove('open');
  });
  document.getElementById('subscribeModal').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('open');
  });
  document.getElementById('confirmSubscribeBtn').addEventListener('click', function () {
    const btn = this;
    btn.disabled = true;
    btn.textContent = 'جارٍ الاشتراك...';
    subscribe().then(function () {
      document.getElementById('subscribeModal').classList.remove('open');
    }).catch(function (err) {
      alert('تعذر تسجيل الاشتراك: ' + err.message);
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = 'نعم';
    });
  });

  /* ===== عرض الهيرو (المعلومات الأساسية) ===== */
  const DESC_LIMIT = 160;

  function renderHero() {
    const hero = document.getElementById('courseHero');
    const desc = compData.description || '';
    const isLong = desc.length > DESC_LIMIT;
    const shownDesc = isLong ? desc.slice(0, DESC_LIMIT).trim() + '…' : desc;
    const isCourse = compData.type !== 'competition';
    const subscribeLabel = isCourse ? 'اشتراك في الكورس' : 'انضمام للمسابقة';
    const lessons = compData.lessons || {};
    const lessonsCount = Object.keys(lessons).length;
    const videosCount = Object.keys(lessons).reduce(function (sum, id) { return sum + Object.keys(lessons[id].videos || {}).length; }, 0);
    const examsCount = Object.keys(lessons).reduce(function (sum, id) { return sum + Object.keys(lessons[id].exams || {}).length; }, 0);
    const coursePct = isEnrolled ? computeCourseProgress(lessons, progressData) : 0;

    hero.innerHTML =
      '<div class="course-hero-v2">' +

        '<div class="chv-media-card">' +
          '<div class="chv-cover">' +
            (compData.coverUrl ? '<img class="chv-cover-img" src="' + escapeHtml(compData.coverUrl) + '" alt="">' : '<div class="chv-cover-img chv-cover-placeholder">' + icon(isCourse ? 'bookOpen' : 'trophy', 'icon-xl') + '</div>') +
            '<span class="content-type-badge ' + (isCourse ? 'course' : 'competition') + '">' + icon(isCourse ? 'bookOpen' : 'trophy', 'icon-sm') + ' ' + (isCourse ? 'كورس' : 'مسابقة') + '</span>' +
            '<span class="chv-ribbon ' + (isCourse ? 'course' : 'competition') + '">' + icon(isCourse ? 'graduationCap' : 'trophy', 'icon-sm') + ' ' + escapeHtml(compData.title || (isCourse ? 'كورس' : 'مسابقة')) + '</span>' +
          '</div>' +

          (isEnrolled
            ? '<span class="chv-cta chv-cta-done"><span>' + icon('circleCheck', 'icon-sm') + ' أنت مشترك بالفعل</span></span>'
            : '<button type="button" class="chv-cta" id="subscribeBtn">' + icon('gem', 'icon-sm') + ' ' + subscribeLabel + ' — مجانًا</button>'
          ) +

          (compData.forumEnabled === true ? '<a class="chv-forum-btn" href="forum.html?id=' + encodeURIComponent(compId) + '">' + icon('commentDots', 'icon-sm') + ' منتدى الأسئلة</a>' : '') +

          '<div class="chv-includes">' +
            '<h4>' + icon('listCheck', 'icon-sm') + ' يشمل هذا المحتوى</h4>' +
            '<ul>' +
              '<li>' + icon('circleCheck', 'icon-sm') + ' ' + lessonsCount + ' محاضرة</li>' +
              '<li>' + icon('circleCheck', 'icon-sm') + ' ' + videosCount + ' فيديو شرح</li>' +
              '<li>' + icon('circleCheck', 'icon-sm') + ' ' + examsCount + ' اختبار تفاعلي</li>' +
              '<li>' + icon('circleCheck', 'icon-sm') + ' وصول كامل مجانًا</li>' +
              (compData.forumEnabled === true ? '<li>' + icon('circleCheck', 'icon-sm') + ' منتدى أسئلة يرد عليه المسؤول</li>' : '') +
            '</ul>' +
          '</div>' +
        '</div>' +

        '<div class="chv-info-card">' +
          '<h1>' + escapeHtml(compData.title || 'بدون عنوان') + '</h1>' +
          (desc ? '<p class="preserve-linebreaks">' + escapeHtml(shownDesc) + '</p>' : '') +
          (isLong ? '<button type="button" class="desc-more-btn" id="descMoreBtn">عرض المزيد <i class="fas fa-chevron-left"></i></button>' : '') +

          (isEnrolled ?
            '<div class="chv-progress-wrap">' +
              '<div class="chv-progress-head"><span>تقدّمك في المحتوى</span><span>' + coursePct + '%</span></div>' +
              '<div class="chv-progress-bar"><div class="chv-progress-fill" style="width:' + coursePct + '%;"></div></div>' +
            '</div>' : ''
          ) +

          (compData.instructorName ?
            '<div class="chv-teacher">' +
              (compData.instructorPhotoUrl
                ? '<img class="chv-teacher-avatar" src="' + escapeHtml(compData.instructorPhotoUrl) + '" alt="' + escapeHtml(compData.instructorName) + '">'
                : '<span class="chv-teacher-avatar chv-teacher-avatar-placeholder">' + icon('graduationCap', 'icon-md') + '</span>') +
              '<div class="chv-teacher-info">' +
                '<strong>' + escapeHtml(compData.instructorName) + '</strong>' +
                '<span>' + icon('mosque', 'icon-sm') + ' معلم المادة</span>' +
              '</div>' +
            '</div>' : ''
          ) +
        '</div>' +

      '</div>';

    if (isLong) {
      document.getElementById('descMoreBtn').addEventListener('click', function () {
        document.getElementById('descModalTitle').textContent = compData.title || '';
        document.getElementById('descModalBody').textContent = desc; // سيتم عرضها مع white-space: pre-wrap
        document.getElementById('descModal').classList.add('open');
      });
    }

    if (!isEnrolled) {
      document.getElementById('subscribeBtn').addEventListener('click', function () {
        document.getElementById('subscribeModalTitle').textContent = subscribeLabel;
        document.getElementById('subscribeModalBody').textContent = isCourse
          ? 'هل تريد تأكيد الاشتراك في هذا الكورس؟'
          : 'هل تريد تأكيد الانضمام لهذه المسابقة؟';
        document.getElementById('subscribeModal').classList.add('open');
      });
    }
  }

  /* ===== عرض قائمة المحاضرات ===== */
  function renderLessons() {
    const wrap = document.getElementById('lessonsWrap');
    const lessons = compData.lessons || {};
    const ids = getSortedLessonIds(lessons);

    if (ids.length === 0) {
      wrap.innerHTML =
        '<div class="empty-state"><div class="empty-state-icon">' + icon('video', 'icon-xl') + '</div><p>لا توجد محاضرات مضافة بعد</p></div>';
      return;
    }

    if (!isEnrolled) {
      const isCourse = compData.type !== 'competition';
      wrap.innerHTML =
        '<div class="enroll-lock-card">' +
          '<div class="big-icon"><i class="fas fa-lock" style="font-size:46px;"></i></div>' +
          '<h3>المحتوى مقفول</h3>' +
          '<p>' + (isCourse ? 'اشترك في الكورس أولاً' : 'انضم للمسابقة أولاً') + ' للوصول إلى المحاضرات والفيديوهات والاختبارات.</p>' +
        '</div>';
      return;
    }

    const now = Date.now();
    // المحاضرات اللي لسه معادها ما جاش (releaseAt في المستقبل) تتخفي تمامًا من القائمة،
    // وتظهر تلقائيًا لما يجي معادها (من غير ما نعرضها مقفولة بمعاد النشر)
    const visibleIds = ids.filter(function (lessonId) {
      const lesson = lessons[lessonId];
      return !lesson.releaseAt || lesson.releaseAt <= now;
    });

    if (visibleIds.length === 0) {
      wrap.innerHTML =
        '<div class="empty-state"><div class="empty-state-icon">' + icon('video', 'icon-xl') + '</div><p>لا توجد محاضرات متاحة الآن</p></div>';
      return;
    }

    let html = '';
    visibleIds.forEach(function (lessonId, index) {
      const lesson = lessons[lessonId];
      const lessonProgress = progressData[lessonId] || {};
      const done = !!lessonProgress.completed;
      const access = getLessonAccessState(lessons, progressData, lessonId);
      const isLocked = !access.allowed;

      const videos = lesson.videos || {};
      const exams = lesson.exams || {};
      const videoIds = Object.keys(videos);
      const examIds = Object.keys(exams);

      let lockNote = '';
      if (access.reason === 'release') {
        lockNote = '<span class="lesson-lock-msg"><i class="fas fa-clock"></i> يُنشر في ' + formatArabicDate(lesson.releaseAt) + '</span>';
      } else if (access.reason === 'sequence') {
        lockNote = '<span class="lesson-lock-msg"><i class="fas fa-lock"></i> أكمِل المحاضرة السابقة أولاً</span>';
      }

      const lItems = getLessonItems(lesson, lessonProgress);
      const secs = lesson.sections || {};
      const secHtml = {};
      let visibleExamCount = 0, vi = 0, ei = 0;
      const qs = function (x) { return encodeURIComponent(x); };
      lItems.forEach(function (it) {
        const d = it.data;
        let html = '';
        if (it.kind === 'exam') {
          if (d.releaseAt && d.releaseAt > now) return;
          visibleExamCount++; ei++;
        }
        if (it.kind === 'video') vi++;
        const icoCls = it.kind === 'exam' ? 'fa-list-check' : (it.kind === 'pdf' ? 'fa-file-pdf' : 'fa-play');
        const title = it.kind === 'exam' ? (d.title || ('الاختبار ' + ei)) : (d.title || (it.kind === 'pdf' ? 'ملف PDF' : ('فيديو الشرح ' + vi)));
        if (it.locked) {
          html = '<div class="content-item disabled"><span class="ci-left"><span class="ci-icon"><i class="fas fa-lock"></i></span>' + escapeHtml(title) + '</span><span class="ci-right">يُفتح بعد حل الاختبار الإجباري</span></div>';
        } else if (it.kind === 'video') {
          const watched = !!(lessonProgress.videos && lessonProgress.videos[it.id] && lessonProgress.videos[it.id].watched);
          html = '<a class="content-item video-item" href="video.html?comp=' + qs(compId) + '&lesson=' + qs(lessonId) + '&video=' + qs(it.id) + '"><span class="ci-left"><span class="ci-icon"><i class="fas fa-play"></i></span>' + escapeHtml(title) + '</span><span class="ci-right">' + (watched ? '<i class="fas fa-check"></i> تمت المشاهدة' : 'مشاهدة') + '</span></a>';
        } else if (it.kind === 'pdf') {
          html = '<a class="content-item material-item" href="' + escapeHtml(d.url) + '" target="_blank" rel="noopener"><span class="ci-left"><span class="ci-icon"><i class="fas fa-file-pdf"></i></span>' + escapeHtml(title) + '</span><span class="ci-right"><i class="fas fa-external-link-alt"></i> فتح</span></a>';
        } else {
          const ep = lessonProgress.exams && lessonProgress.exams[it.id];
          const done = !!(ep && ep.completed);
          const qCount = d.questions ? Object.keys(d.questions).length : 0;
          const tag = (d.mustPass === true ? ' <small>(إجباري)</small>' : '');
          const state = done ? ('<i class="fas fa-check"></i> ' + (ep.essayStatus === 'pending' ? 'جاري التصحيح' : 'تم الحل')) : (qCount + ' سؤال · ابدأ');
          html = '<a class="content-item exam-item" href="exam.html?comp=' + qs(compId) + '&lesson=' + qs(lessonId) + '&exam=' + qs(it.id) + '"><span class="ci-left"><span class="ci-icon"><i class="fas fa-list-check"></i></span>' + escapeHtml(title) + tag + '</span><span class="ci-right">' + state + '</span></a>';
        }
        const key = it.sectionId && secs[it.sectionId] ? it.sectionId : '';
        secHtml[key] = (secHtml[key] || '') + html;
        secHtml['__n' + key] = (secHtml['__n' + key] || 0) + 1;
      });

      const materials = lesson.materials || {};
      const materialIds = Object.keys(materials);
      let materialsHtml = '';
      materialIds.forEach(function (mid) {
        const m = materials[mid];
        const isPdf = m.type === 'pdf';
        materialsHtml +=
          '<a class="content-item material-item ' + (isPdf ? '' : 'image-type') + '" href="' + escapeHtml(m.url) + '" target="_blank" rel="noopener">' +
            '<span class="ci-left"><span class="ci-icon"><i class="fas fa-' + (isPdf ? 'file-pdf' : 'image') + '"></i></span>' + escapeHtml(m.name || 'مرفق') + '</span>' +
            '<span class="ci-right"><i class="fas fa-external-link-alt"></i> فتح</span>' +
          '</a>';
      });

      function lessonGroup(label, itemsHtml, count) {
        if (!count) return '';
        return (
          '<div class="lesson-group">' +
            '<button class="lesson-group-header" type="button">' +
              '<span class="lg-toggle"><i class="fas fa-chevron-down"></i><span class="lg-toggle-text">عرض</span></span>' +
              '<span class="lg-title">' + label + '</span>' +
            '</button>' +
            '<div class="lesson-group-body"><div class="lesson-group-body-inner">' + itemsHtml + '</div></div>' +
          '</div>'
        );
      }

      const secKeys = Object.keys(secs).sort(function (x, y) { return (secs[x].order || 0) - (secs[y].order || 0); });
      let groupsHtml = lessonGroup(secKeys.length ? 'المحتوى العام' : 'محتوى المحاضرة', secHtml[''] || '', secHtml['__n'] || 0);
      secKeys.forEach(function (k) { groupsHtml += lessonGroup(escapeHtml(secs[k].title || 'قسم'), secHtml[k] || '', secHtml['__n' + k] || 0); });
      groupsHtml += lessonGroup('المرفقات', materialsHtml, materialIds.length);
      if (!groupsHtml) {
        groupsHtml = '<p class="muted" style="font-size:12.5px; padding:8px 4px;">لا يوجد محتوى في هذه المحاضرة بعد.</p>';
      }

      const itemsCount = lItems.length - (examIds.length - visibleExamCount) + materialIds.length;

      /* لو فيه وصف للمحاضرة، يظهر مختصرًا مع "عرض المزيد" بيفتح جوه نفس مكانه */
      const desc = (lesson.description || '').trim();
      const DESC_LIMIT = 70;
      let subHtml;
      if (desc) {
        const isLong = desc.length > DESC_LIMIT;
        const shortDesc = isLong ? desc.slice(0, DESC_LIMIT).trim() + '…' : desc;
        subHtml =
          '<span class="lesson-desc" data-full="' + escapeHtml(desc) + '" data-short="' + escapeHtml(shortDesc) + '" data-expanded="0">' +
            '<span class="lesson-desc-text">' + escapeHtml(shortDesc) + '</span>' +
            (isLong ? ' <span class="lesson-more" data-role="desc-toggle">عرض المزيد</span>' : '') +
          '</span>';
      } else {
        subHtml =
          '<span class="lesson-sub-text">' + videoIds.length + ' فيديو · ' + visibleExamCount + ' اختبار' + (done ? ' · تم الإنجاز' : '') + '</span>';
      }

      html +=
        '<div class="accordion-lesson" data-lesson="' + lessonId + '">' +
          '<button class="accordion-header" ' + (isLocked ? 'disabled' : '') + '>' +
            '<span class="lesson-main">' +
              '<h4 class="lesson-title">' + escapeHtml(lesson.title || 'محاضرة') + '</h4>' +
              '<span class="lesson-sub">' + (isLocked ? lockNote : subHtml) + '</span>' +
            '</span>' +
            '<span class="lesson-side">' +
              '<span class="lesson-badge ' + (done ? 'done' : (isLocked ? 'locked' : 'active')) + '">' +
                (done ? '<i class="fas fa-check"></i>' : (isLocked ? '<i class="fas fa-lock"></i>' : '<i class="fas fa-chevron-down chevron"></i>')) +
              '</span>' +
              (isLocked ? '' : '<span class="lesson-count">(' + itemsCount + ')</span>') +
            '</span>' +
          '</button>' +
          (isLocked ? '' : '<div class="accordion-body"><div class="accordion-body-inner">' + groupsHtml + '</div></div>') +
        '</div>';
    });

    wrap.innerHTML = html;

    wrap.querySelectorAll('.accordion-header:not([disabled])').forEach(function (btn) {
      btn.addEventListener('click', function () {
        btn.closest('.accordion-lesson').classList.toggle('open');
      });
    });

    /* تبديل مجموعات المحتوى (الشرح / الامتحان / المرفقات) كل واحدة لوحدها */
    wrap.querySelectorAll('.lesson-group-header').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        const group = btn.closest('.lesson-group');
        group.classList.toggle('open');
        btn.querySelector('.lg-toggle-text').textContent = group.classList.contains('open') ? 'إخفاء' : 'عرض';
      });
    });

    /* عرض المزيد/عرض أقل لوصف المحاضرة، بيفتح جوه نفس مكانه */
    wrap.querySelectorAll('[data-role="desc-toggle"]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        const holder = el.closest('.lesson-desc');
        const textEl = holder.querySelector('.lesson-desc-text');
        const expanded = holder.getAttribute('data-expanded') === '1';
        textEl.textContent = expanded ? holder.getAttribute('data-short') : holder.getAttribute('data-full');
        el.textContent = expanded ? 'عرض المزيد' : 'عرض أقل';
        holder.setAttribute('data-expanded', expanded ? '0' : '1');
      });
    });
  }

  /* ===== إغلاق نافذة الوصف ===== */
  document.getElementById('closeDescModal').addEventListener('click', function () {
    document.getElementById('descModal').classList.remove('open');
  });
  document.getElementById('descModal').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('open');
  });
</script>
</body>
</html>
