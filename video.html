<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("asb_theme")||"light")</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>الفيديو — منصة د.علاء صبح</title>
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>

<header class="app-header" id="appHeader"></header>

<main class="page video-page">
  <h1 class="sr-only" id="videoTitle">جارٍ التحميل...</h1>

  <div class="video-layout">
    <div class="video-main">
      <div class="video-top-bar">
        <a class="video-back-link" id="backLink" href="competition.html"><svg class="icon icon-sm" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M502.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L402.7 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l370.7 0-105.4 105.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"/></svg> الرجوع للكورس</a>
      </div>
      <div class="video-quick-row" id="videoQuickRow"></div>
      <button type="button" class="video-fav-btn" id="favoriteBtn" style="display:none;"></button>

      <div id="content">
        <div class="center-loading"><div class="loader"></div></div>
      </div>
    </div>

    <aside class="video-sidebar" id="videoSidebar" style="display:none;">
      <h2 class="video-sidebar-heading">الدروس</h2>
      <div class="video-sidebar-list" id="videoSidebarList"></div>
    </aside>
  </div>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=9"></script>
<script src="icons.js?v=3"></script>
<script src="app-shell.js?v=6"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const compId = params.get('comp');
  const lessonId = params.get('lesson');
  const videoId = params.get('video');
  if (!compId || !lessonId || !videoId) window.location.href = 'home.html';

  document.getElementById('backLink').href = 'competition.html?id=' + encodeURIComponent(compId);

  let currentUser = null;
  let currentUserData = null;

  /* ---------------- حالة حد المشاهدات ووقت المشاهدة (مشتركة بين الدوال) ---------------- */
  const DEFAULT_MAX_VIEWS = 3;
  let progRef = null;
  let maxViewsAllowed = DEFAULT_MAX_VIEWS;
  let viewsUsedCount = 0;
  let isVideoBlocked = false;
  let crossed80This = false;
  let maxWatchedPercentBase = 0;
  let lastFlushedPercent = 0;
  let totalWatchSecondsBase = 0;
  let watchAccumSeconds = 0;
  let lastFlushedAccum = 0;
  let statsFlushTimer = null;

  requireAuth(function (user, userData) {
    currentUser = user;
    currentUserData = userData;
    renderAppHeader(user, userData, { showPoints: true });
    renderFooter();
    load();
  });

  function load() {
    db.ref('competitions/' + compId).once('value').then(function (snap) {
      if (!snap.exists()) { window.location.href = 'home.html'; return; }
      const compData = snap.val();
      const lessons = compData.lessons || {};
      const lesson = lessons[lessonId];
      if (!lesson || !lesson.videos || !lesson.videos[videoId]) { window.location.href = 'competition.html?id=' + encodeURIComponent(compId); return; }

      db.ref('userEnrollments/' + currentUser.uid + '/' + compId).once('value').then(function (eSnap) {
        if (!eSnap.exists()) {
          document.getElementById('videoTitle').textContent = 'محتوى مغلق';
          document.getElementById('content').innerHTML =
            '<div class="already-done-card"><div class="big-icon" style="color:var(--teal);">' + icon('lock', 'icon-xl') + '</div>' +
            '<h3 style="margin:10px 0 6px; color:var(--primary-dark);">لازم تشترك أولاً</h3><p class="muted">اشترك في هذا المحتوى من صفحته للوصول لهذا الفيديو.</p>' +
            '<a class="btn btn-primary btn-sm" style="width:auto; margin:14px auto 0;" href="competition.html?id=' + encodeURIComponent(compId) + '">الذهاب لصفحة المحتوى</a></div>';
          return;
        }
        loadWithAccess();
      });

      function loadWithAccess() {
      db.ref('userProgress/' + currentUser.uid + '/' + compId).once('value').then(function (pSnap) {
        const progressData = pSnap.val() || {};
        const access = getLessonAccessState(lessons, progressData, lessonId);
        const content = document.getElementById('content');

        if (!access.allowed) {
          document.getElementById('videoTitle').textContent = 'محتوى مغلق';
          const reasonText = access.reason === 'release' ? 'هذه المحاضرة لم يحن معادها بعد.' : 'أكمِل المحاضرة السابقة أولاً.';
          content.innerHTML =
            '<div class="already-done-card"><div class="big-icon" style="color:var(--teal);">' + icon('lock', 'icon-xl') + '</div>' +
            '<h3 style="margin:10px 0 6px; color:var(--primary-dark);">هذا المحتوى مغلق</h3><p class="muted">' + reasonText + '</p></div>';
          return;
        }

        if (isItemLocked(lesson, progressData[lessonId] || {}, 'video', videoId)) {
          document.getElementById('videoTitle').textContent = 'محتوى مغلق';
          content.innerHTML = '<div class="already-done-card"><div class="big-icon" style="color:var(--teal);">' + icon('lock', 'icon-xl') + '</div><h3 style="margin:10px 0 6px; color:var(--primary-dark);">هذا المحتوى مغلق</h3><p class="muted">لازم تحل الاختبار الإجباري اللي قبله الأول.</p></div>';
          return;
        }
        const video = lesson.videos[videoId];
        const lessonProgress = progressData[lessonId] || {};
        const videoProgress = (lessonProgress.videos && lessonProgress.videos[videoId]) || {};
        document.getElementById('videoTitle').textContent = video.title || 'فيديو الشرح';
        renderVideo(video, lesson, videoProgress);
        renderQuickActions(lesson);
        setupFavoriteButton();
        renderVideoSidebar(lessons, progressData);
      });
      }
    });
  }

  function renderVideo(video, lesson, videoProgress) {
    const content = document.getElementById('content');
    const ytId = extractYouTubeId(video.url);

    progRef = db.ref('userProgress/' + currentUser.uid + '/' + compId + '/' + lessonId);

    // إعداد حالة عدد المشاهدات المسموح بها (يضبطها المسؤول لكل فيديو من Firebase، وإلا الافتراضي 3)
    const configuredMax = Number(video.maxViews);
    maxViewsAllowed = (configuredMax && configuredMax > 0) ? Math.floor(configuredMax) : DEFAULT_MAX_VIEWS;
    viewsUsedCount = Number(videoProgress.viewsUsed) || 0;
    isVideoBlocked = viewsUsedCount >= maxViewsAllowed;
    crossed80This = false;
    maxWatchedPercentBase = Number(videoProgress.maxWatchedPercent) || 0;
    lastFlushedPercent = maxWatchedPercentBase;
    totalWatchSecondsBase = Number(videoProgress.totalWatchSeconds) || 0;
    watchAccumSeconds = 0;
    lastFlushedAccum = 0;

    let html = '';
    if (ytId && !isVideoBlocked) {
      const thumbUrl = 'https://img.youtube.com/vi/' + ytId + '/maxresdefault.jpg';
      html += '<div class="video-solo-wrap" id="videoWrap">' +
          '<div class="video-cover" id="videoCover">' +
            '<img class="video-cover-img" id="videoCoverImg" src="' + thumbUrl + '" alt="" loading="eager" ' +
              'onerror="this.onerror=null; this.src=\'https://img.youtube.com/vi/' + ytId + '/hqdefault.jpg\';">' +
            '<div class="video-cover-shade"></div>' +
            '<button type="button" class="video-cover-play" id="videoCoverPlay" aria-label="تشغيل الفيديو">' +
              icon('play', 'icon-xl') +
            '</button>' +
          '</div>' +
          '<div id="ytPlayerMount"></div>' +
          '<div class="player-click-catcher" id="playerClickCatcher"></div>' +
          '<div class="video-end-overlay" id="videoEndOverlay">' +
            '<button type="button" class="replay-btn" id="replayBtn">' + icon('rotateLeft', 'icon-md') + ' إعادة المشاهدة</button>' +
          '</div>' +
          '<div class="custom-controls" id="customControls">' +
            '<div class="progress-track" id="progressTrack"><div class="progress-groove"></div><div class="progress-fill" id="progressFill"></div></div>' +
            '<div class="controls-row">' +
              '<button type="button" class="ctrl-icon-btn" id="playPauseBtn" aria-label="تشغيل/إيقاف">' + PLAY_PAUSE_ICON.play + '</button>' +
              '<span class="time-display" id="timeDisplay">0:00 / 0:00</span>' +
              '<div class="controls-spacer"></div>' +
              '<button type="button" class="ctrl-icon-btn" id="volumeBtn" aria-label="الصوت">' + VOLUME_ICON.high + '</button>' +
              '<input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="100">' +
              '<button type="button" class="ctrl-speed-btn" id="speedBtn">1x</button>' +
              '<button type="button" class="ctrl-icon-btn" id="fullscreenBtn" aria-label="تكبير الفيديو">' + FULLSCREEN_ICON.enter + '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    } else if (isVideoBlocked) {
      html += '<div class="already-done-card" id="videoLockedCard">' +
          '<div class="big-icon" style="color:var(--teal);">' + icon('lock', 'icon-xl') + '</div>' +
          '<h3 style="margin:10px 0 6px; color:var(--primary-dark);">استنفدت عدد المشاهدات المتاحة</h3>' +
          '<p class="muted">استخدمت كل مشاهداتك المسموح بها لهذه المحاضرة (' + maxViewsAllowed + ' مشاهدات). تقدر تشوف تفاصيل المحاضرة تحت.</p>' +
        '</div>';
    } else {
      html += '<p class="muted">تعذر تحميل الفيديو</p>';
    }

    html += '<div class="video-title-row">' +
        '<button type="button" class="video-share-btn" id="shareBtn" aria-label="مشاركة" title="مشاركة">' + icon('shareNodes', 'icon-sm') + '</button>' +
        '<h2 class="video-title-text">' + icon('bookOpen', 'icon-sm') + ' <span>' + escapeHtml(video.title || lesson.title || 'فيديو الشرح') + '</span></h2>' +
      '</div>';

    html += renderVideoStatsCard(video, lesson);

    html += '<div class="comments-section">' +
      '<h3>' + icon('comment', 'icon-md') + ' الأسئلة والتعليقات</h3>' +
      '<div class="comment-form">' +
        '<input type="text" id="commentInput" placeholder="اكتب سؤالك أو تعليقك هنا..." maxlength="400">' +
        '<button class="btn btn-primary btn-sm" id="sendCommentBtn" style="width:auto;">إرسال</button>' +
      '</div>' +
      '<div class="comment-msg" id="commentMsg"></div>' +
      '<div class="comment-list" id="commentList"><div class="center-loading" style="min-height:60px;"><div class="loader"></div></div></div>' +
    '</div>';

    content.innerHTML = html;
    if (ytId && !isVideoBlocked) {
      setupVideoCover(ytId);
      getOrCreateWatermarkCode(currentUser.uid, function (code) {
        const wrap = document.getElementById('videoWrap');
        startVideoWatermark(wrap, code, currentUserData.name || '');
      });
      statsFlushTimer = setInterval(flushProgressStats, 4000);
      window.addEventListener('pagehide', flushProgressStats);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') flushProgressStats();
      });
    }

    // تسجيل المشاهدة تلقائيًا وتحديث حالة اكتمال المحاضرة
    progRef.child('videos/' + videoId + '/watched').set(true).then(function () {
      progRef.once('value').then(function (snap) {
        const lp = snap.val() || {};
        const c = computeLessonCompletion(lesson, lp);
        progRef.update({ completed: c.completed, earnedPoints: c.earnedPoints });
      });
    });

    setupShareButton();
    loadComments();
    document.getElementById('sendCommentBtn').addEventListener('click', sendComment);
    document.getElementById('commentInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') sendComment();
    });
  }

  /* ---------------- بطاقة تفاصيل المحاضرة: الوصف + مدة الفيديو + عدد المشاهدات + إجمالي وقت المشاهدة ---------------- */
  function renderVideoStatsCard(video, lesson) {
    const desc = (lesson.description || '').trim();
    const descHtml = desc
      ? '<p class="video-stats-desc">' + icon('circleInfo', 'icon-xs') + ' <span>' + escapeHtml(desc) + '</span></p>'
      : '';

    const hasAdminDuration = !!(Number(video.durationMinutes) > 0);
    const durationLabel = hasAdminDuration
      ? formatMinutesLabel(Number(video.durationMinutes))
      : (isVideoBlocked ? 'غير محددة' : '—');

    return (
      '<div class="video-stats-card" id="videoStatsCard">' +
        descHtml +
        '<div class="video-stats-grid">' +
          '<div class="video-stats-item">' + icon('clock', 'icon-sm') +
            '<span class="vsi-label">مدة الفيديو</span>' +
            '<span class="vsi-value" id="statDuration">' + durationLabel + '</span>' +
          '</div>' +
          '<div class="video-stats-item">' + icon('eye', 'icon-sm') +
            '<span class="vsi-label">عدد المشاهدات</span>' +
            '<span class="vsi-value" id="statViews">' + viewsUsedCount + ' من ' + maxViewsAllowed + '</span>' +
          '</div>' +
          '<div class="video-stats-item">' + icon('hourglass', 'icon-sm') +
            '<span class="vsi-label">إجمالي وقت المشاهدة</span>' +
            '<span class="vsi-value" id="statWatchTime">' + formatWatchDuration(totalWatchSecondsBase) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="video-stats-progress">' +
          '<div class="vsp-head"><span>' + icon('chartSimple', 'icon-xs') + ' نسبة مشاهدتك للمحاضرة</span><span id="statPercentLabel">' + Math.round(maxWatchedPercentBase) + '%</span></div>' +
          '<div class="vsp-track"><div class="vsp-fill" id="statPercentFill" style="width:' + Math.round(maxWatchedPercentBase) + '%"></div></div>' +
        '</div>' +
      '</div>'
    );
  }

  function formatMinutesLabel(mins) {
    mins = Math.max(1, Math.round(mins));
    return mins + ' دقيقة';
  }

  function formatWatchDuration(totalSeconds) {
    totalSeconds = Math.floor(totalSeconds || 0);
    if (totalSeconds < 60) return totalSeconds + ' ثانية';
    return Math.round(totalSeconds / 60) + ' دقيقة';
  }

  /* يُستدعى مع كل تحديث لموضع التشغيل: يحدّث أعلى نسبة مشاهدة، ويخصم مشاهدة تلقائيًا عند تخطي 80% (مرة واحدة لكل دخول للصفحة) */
  function trackWatchProgress(pct) {
    if (!isFinite(pct)) return;
    pct = Math.max(0, Math.min(100, pct));
    if (pct > maxWatchedPercentBase) {
      maxWatchedPercentBase = pct;
      const label = document.getElementById('statPercentLabel');
      const fill = document.getElementById('statPercentFill');
      if (label) label.textContent = Math.round(maxWatchedPercentBase) + '%';
      if (fill) fill.style.width = Math.round(maxWatchedPercentBase) + '%';
    }
    if (!crossed80This && maxWatchedPercentBase >= 80) {
      crossed80This = true;
      registerViewUsed();
    }
  }

  /* خصم مشاهدة واحدة عند اكتمال 80% من المحاضرة */
  function registerViewUsed() {
    viewsUsedCount += 1;
    progRef.child('videos/' + videoId + '/viewsUsed').set(viewsUsedCount);
    const el = document.getElementById('statViews');
    if (el) el.textContent = viewsUsedCount + ' من ' + maxViewsAllowed;
    if (viewsUsedCount >= maxViewsAllowed && typeof showToast === 'function') {
      showToast('كده استخدمت كل المشاهدات المتاحة لهذه المحاضرة (' + maxViewsAllowed + ')', 'info');
    }
  }

  /* عداد وقت المشاهدة الفعلي: يزيد ثانية بثانية أثناء التشغيل فقط */
  function tickWatchTime() {
    if (!ytReady || !ytPlayer) return;
    if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
      watchAccumSeconds += 1;
      const el = document.getElementById('statWatchTime');
      if (el) el.textContent = formatWatchDuration(totalWatchSecondsBase + watchAccumSeconds);
    }
  }

  /* حفظ دوري (وعند مغادرة الصفحة) لنسبة المشاهدة القصوى وإجمالي وقت المشاهدة، بدون كتابة زيادة عن الحاجة */
  function flushProgressStats() {
    if (!progRef) return;
    const updates = {};
    if (watchAccumSeconds > lastFlushedAccum) {
      updates['videos/' + videoId + '/totalWatchSeconds'] = totalWatchSecondsBase + watchAccumSeconds;
      lastFlushedAccum = watchAccumSeconds;
    }
    const roundedPct = Math.round(maxWatchedPercentBase);
    if (roundedPct > lastFlushedPercent) {
      updates['videos/' + videoId + '/maxWatchedPercent'] = roundedPct;
      lastFlushedPercent = roundedPct;
    }
    if (Object.keys(updates).length) progRef.update(updates);
  }

  /* ---------------- الأزرار السريعة أعلى الفيديو (ملف شرح / اختبار تطبيقي) ---------------- */
  function renderQuickActions(lesson) {
    const row = document.getElementById('videoQuickRow');
    const materials = lesson.materials || {};
    const materialIds = Object.keys(materials);
    const exams = lesson.exams || {};
    const now = Date.now();
    const examIds = Object.keys(exams).filter(function (eid) {
      const ex = exams[eid];
      return !ex.releaseAt || ex.releaseAt <= now;
    });

    let html = '';
    if (materialIds.length) {
      const m = materials[materialIds[0]];
      html += '<a class="video-pill-btn" href="' + escapeHtml(m.url) + '" target="_blank" rel="noopener">ملف شرح ' + icon('chevronLeft', 'icon-xs') + '</a>';
    }
    if (examIds.length) {
      html += '<a class="video-pill-btn" href="exam.html?comp=' + encodeURIComponent(compId) + '&lesson=' + encodeURIComponent(lessonId) + '&exam=' + encodeURIComponent(examIds[0]) + '">اختبار تطبيقي ' + icon('chevronLeft', 'icon-xs') + '</a>';
    }
    row.innerHTML = html;
    row.style.display = html ? 'flex' : 'none';
  }

  /* ---------------- زر إضافة إلى المفضلة (محفوظ لكل مستخدم تحت favorites/{uid}/{lessonId}) ---------------- */
  function setupFavoriteButton() {
    const btn = document.getElementById('favoriteBtn');
    const favRef = db.ref('favorites/' + currentUser.uid + '/' + lessonId);

    function renderState(isFav) {
      btn.innerHTML = icon(isFav ? 'circleCheck' : 'star', 'icon-xs') + ' ' + (isFav ? 'أُضيفت إلى المفضلة' : 'إضافة إلى المفضلة');
      btn.classList.toggle('is-active', isFav);
    }

    favRef.once('value').then(function (snap) {
      renderState(!!snap.val());
      btn.style.display = 'inline-flex';
    });

    btn.addEventListener('click', function () {
      favRef.once('value').then(function (snap) {
        const isFav = !!snap.val();
        favRef.set(isFav ? null : true).then(function () { renderState(!isFav); });
      });
    });
  }

  /* ---------------- الشريط الجانبي: قائمة "الدروس" مع تمييز المحاضرة الحالية ---------------- */
  function renderVideoSidebar(lessons, progressData) {
    const sidebar = document.getElementById('videoSidebar');
    const listEl = document.getElementById('videoSidebarList');
    const now = Date.now();

    const l = lessons[lessonId];
    const lp = progressData[lessonId] || {};

    const desc = (l.description || '').trim();
    const DESC_LIMIT = 60;
    let descHtml = '';
    if (desc) {
      const isLong = desc.length > DESC_LIMIT;
      const shortDesc = isLong ? desc.slice(0, DESC_LIMIT).trim() + '…' : desc;
      descHtml =
        '<div class="vs-current-note">' + icon('circleInfo', 'icon-xs') +
          '<span class="vs-note-text" data-full="' + escapeHtml(desc) + '" data-short="' + escapeHtml(shortDesc) + '" data-expanded="0">' + escapeHtml(shortDesc) + '</span>' +
        '</div>' +
        (isLong ? '<button type="button" class="vs-more-btn" data-role="vs-desc-toggle">عرض باقي التفاصيل</button>' : '');
    }

    const videos = l.videos || {};
    const videoIds = Object.keys(videos);
    let videosHtml = videoIds.map(function (vid) {
      const watched = !!(lp.videos && lp.videos[vid] && lp.videos[vid].watched);
      const isPlaying = vid === videoId;
      return '<a class="vs-item' + (isPlaying ? ' active' : '') + '" href="video.html?comp=' + encodeURIComponent(compId) + '&lesson=' + encodeURIComponent(lessonId) + '&video=' + encodeURIComponent(vid) + '">' +
        '<span class="vs-item-title">' + icon('play', 'icon-xs') + ' ' + escapeHtml(videos[vid].title || 'فيديو الشرح') + '</span>' +
        (watched ? '<span class="vs-item-status">' + icon('check', 'icon-xs') + '</span>' : '') +
      '</a>';
    }).join('') || '<div class="vs-empty">لا يوجد فيديوهات</div>';

    const exams = l.exams || {};
    const examIds = Object.keys(exams).filter(function (eid) { const ex = exams[eid]; return !ex.releaseAt || ex.releaseAt <= now; });
    let examsHtml = examIds.map(function (eid) {
      const ex = exams[eid];
      const examDone = !!(lp.exams && lp.exams[eid] && lp.exams[eid].completed);
      return '<a class="vs-item' + (examDone ? ' done' : '') + '" href="exam.html?comp=' + encodeURIComponent(compId) + '&lesson=' + encodeURIComponent(lessonId) + '&exam=' + encodeURIComponent(eid) + '">' +
        '<span class="vs-item-title">' + icon('listCheck', 'icon-xs') + ' ' + escapeHtml(ex.title || 'اختبار تطبيقي') + '</span>' +
        (examDone ? '<span class="vs-item-status">' + icon('check', 'icon-xs') + '</span>' : '') +
      '</a>';
    }).join('') || '<div class="vs-empty">لا يوجد اختبارات</div>';

    const html =
      '<div class="vs-lesson vs-current">' +
        '<span class="vs-live-dot"></span>' +
        '<div class="vs-current-head">' +
          '<div class="vs-current-info">' +
            '<div class="vs-current-title">' + icon('bookOpen', 'icon-sm') + ' <span>' + escapeHtml(l.title || 'محاضرة') + '</span></div>' +
            descHtml +
          '</div>' +
          '<span class="vs-here-badge">أنت هنا</span>' +
        '</div>' +
      '</div>' +
      '<div class="vs-group open">' +
        '<button type="button" class="vs-group-header" data-target="vsGroupVideos">' +
          '<span class="vs-group-title">الشرح</span>' +
          '<span class="vs-group-toggle">عرض ' + icon('chevronUp', 'icon-xs') + '</span>' +
        '</button>' +

  /* ---------------- مشغل يوتيوب مخصص: بدون عناصر تحكم أصلية، بس شريط تقدّم + مدة + صوت + سرعة ---------------- */
  const PLAY_PAUSE_ICON = {
    play: '<svg viewBox="0 0 384 512" fill="currentColor"><path d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80L0 432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.1 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41L73 39z"/></svg>',
    pause: '<svg viewBox="0 0 320 512" fill="currentColor"><path d="M48 64C21.5 64 0 85.5 0 112L0 400c0 26.5 21.5 48 48 48l32 0c26.5 0 48-21.5 48-48l0-288c0-26.5-21.5-48-48-48L48 64zM208 64c-26.5 0-48 21.5-48 48l0 288c0 26.5 21.5 48 48 48l32 0c26.5 0 48-21.5 48-48l0-288c0-26.5-21.5-48-48-48l-32 0z"/></svg>'
  };
  const VOLUME_ICON = {
    high: '<svg viewBox="0 0 576 512" fill="currentColor"><path d="M301.1 34.8C312.6 40 320 51.4 320 64l0 384c0 12.6-7.4 24-18.9 29.2s-25 3.1-34.4-5.3L131.8 352 64 352c-35.3 0-64-28.7-64-64l0-64c0-35.3 28.7-64 64-64l67.8 0L266.7 40.1c9.4-8.4 22.9-10.4 34.4-5.3zM412.6 181.5c33.7 24.6 55.4 64.5 55.4 109.5s-21.8 84.9-55.4 109.5c-10.7 7.8-25.7 5.4-33.5-5.3s-5.4-25.7 5.3-33.5c21.5-15.7 35.6-41.1 35.6-70.7s-14.1-55-35.6-70.7c-10.7-7.8-13.1-22.8-5.3-33.5s22.8-13.1 33.5-5.3z"/></svg>',
    muted: '<svg viewBox="0 0 576 512" fill="currentColor"><path d="M301.1 34.8C312.6 40 320 51.4 320 64l0 384c0 12.6-7.4 24-18.9 29.2s-25 3.1-34.4-5.3L131.8 352 64 352c-35.3 0-64-28.7-64-64l0-64c0-35.3 28.7-64 64-64l67.8 0L266.7 40.1c9.4-8.4 22.9-10.4 34.4-5.3zM425 167l55 55 55-55c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9l-55 55 55 55c9.4 9.4 9.4 24.6 0 33.9s-24.6 9.4-33.9 0l-55-55-55 55c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l55-55-55-55c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0z"/></svg>'
  };
  const FULLSCREEN_ICON = {
    enter: '<svg viewBox="0 0 448 512" fill="currentColor"><path d="M32 32C14.3 32 0 46.3 0 64l0 96c0 17.7 14.3 32 32 32s32-14.3 32-32l0-64 64 0c17.7 0 32-14.3 32-32s-14.3-32-32-32L32 32zM64 352c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 96c0 17.7 14.3 32 32 32l96 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-64 0 0-64zM320 32c-17.7 0-32 14.3-32 32s14.3 32 32 32l64 0 0 64c0 17.7 14.3 32 32 32s32-14.3 32-32l0-96c0-17.7-14.3-32-32-32l-96 0zM448 352c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 64-64 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l96 0c17.7 0 32-14.3 32-32l0-96z"/></svg>',
    exit: '<svg viewBox="0 0 448 512" fill="currentColor"><path d="M160 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 64-64 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l96 0c17.7 0 32-14.3 32-32l0-96zM32 320c-17.7 0-32 14.3-32 32s14.3 32 32 32l64 0 0 64c0 17.7 14.3 32 32 32s32-14.3 32-32l0-96c0-17.7-14.3-32-32-32l-96 0zM288 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 96c0 17.7 14.3 32 32 32l96 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-64 0 0-64zM256 320c-17.7 0-32 14.3-32 32l0 96c0 17.7 14.3 32 32 32s32-14.3 32-32l0-64 64 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-96 0z"/></svg>'
  };
  const SPEED_STEPS = [1, 1.25, 1.5, 1.75, 2, 0.5, 0.75];
  let ytPlayer = null;
  let ytReady = false;
  let speedIndex = 0;
  let lastVolume = 100;
  let seeking = false;
  let playbackStartedAt = 0;

  function loadYouTubeAPI(cb) {
    if (window.YT && window.YT.Player) { cb(); return; }
    const prevCb = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function () {
      if (typeof prevCb === 'function') prevCb();
      cb();
    };
    if (!document.getElementById('ytIframeApiScript')) {
      const tag = document.createElement('script');
      tag.id = 'ytIframeApiScript';
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }
  }

  /* ---------------- غلاف الفيديو: صورة الغلاف فقط بدون أي معلومات عن القناة، والتشغيل الفعلي يبدأ بعد ضغط المستخدم ---------------- */
  function setupVideoCover(ytId) {
    const cover = document.getElementById('videoCover');
    const playBtn = document.getElementById('videoCoverPlay');
    if (!cover || !playBtn) { initCustomPlayer(ytId); return; }

    function startPlayback() {
      playbackStartedAt = Date.now();
      cover.classList.add('is-hidden');
      document.getElementById('videoWrap').classList.add('is-playing');
      initCustomPlayer(ytId, true);
      cover.removeEventListener('click', startPlayback);
    }
    cover.addEventListener('click', startPlayback);
  }

  function initCustomPlayer(ytId, autoplay) {
    loadYouTubeAPI(function () {
      ytPlayer = new YT.Player('ytPlayerMount', {
        videoId: ytId,
        playerVars: {
          controls: 0, disablekb: 1, modestbranding: 1, rel: 0,
          iv_load_policy: 3, fs: 0, playsinline: 1,
          autoplay: autoplay ? 1 : 0
        },
        events: { onReady: onPlayerReady, onStateChange: onPlayerStateChange }
      });
    });
  }

  function onPlayerReady() {
    ytReady = true;
    ytPlayer.playVideo();
    setInterval(updateProgress, 250);
    setInterval(tickWatchTime, 1000);

    // لو المسؤول ماحددش مدة المحاضرة يدويًا، نجيبها من اليوتيوب نفسه بعد جاهزية المشغل
    const durationEl = document.getElementById('statDuration');
    if (durationEl && durationEl.textContent === '—') {
      const durSec = ytPlayer.getDuration() || 0;
      if (durSec > 0) durationEl.textContent = formatMinutesLabel(durSec / 60);
    }

    document.getElementById('playPauseBtn').addEventListener('click', function () { togglePlay(); showControlsBar(); });
    setupTapGestures();
    scheduleHideControls();
    document.getElementById('customControls').addEventListener('pointerdown', function () { showControlsBar(); });
    document.getElementById('videoWrap').addEventListener('mousemove', function () { showControlsBar(); });
    document.getElementById('replayBtn').addEventListener('click', function () {
      document.getElementById('videoEndOverlay').classList.remove('show');
      ytPlayer.seekTo(0, true);
      ytPlayer.playVideo();
    });

    const track = document.getElementById('progressTrack');
    function seekFromEvent(e) {
      const rect = track.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const fraction = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const duration = ytPlayer.getDuration() || 0;
      ytPlayer.seekTo(duration * fraction, true);
      document.getElementById('progressFill').style.width = (fraction * 100) + '%';
      track.style.setProperty('--fill', (fraction * 100) + '%');
    }
    track.addEventListener('mousedown', function (e) { seeking = true; seekFromEvent(e); });
    document.addEventListener('mousemove', function (e) { if (seeking) seekFromEvent(e); });
    document.addEventListener('mouseup', function () { seeking = false; });
    track.addEventListener('touchstart', function (e) { seeking = true; seekFromEvent(e); e.preventDefault(); }, { passive: false });
    track.addEventListener('touchmove', function (e) { if (seeking) seekFromEvent(e); e.preventDefault(); }, { passive: false });
    document.addEventListener('touchend', function () { seeking = false; });

    const volumeSlider = document.getElementById('volumeSlider');
    const volumeBtn = document.getElementById('volumeBtn');
    volumeSlider.addEventListener('input', function () {
      const v = parseInt(volumeSlider.value, 10);
      ytPlayer.setVolume(v);
      if (v === 0) { ytPlayer.mute(); volumeBtn.innerHTML = VOLUME_ICON.muted; }
      else { ytPlayer.unMute(); lastVolume = v; volumeBtn.innerHTML = VOLUME_ICON.high; }
    });
    volumeBtn.addEventListener('click', function () {
      if (ytPlayer.isMuted() || ytPlayer.getVolume() === 0) {
        ytPlayer.unMute();
        const restore = lastVolume || 100;
        ytPlayer.setVolume(restore);
        volumeSlider.value = restore;
        volumeBtn.innerHTML = VOLUME_ICON.high;
      } else {
        lastVolume = ytPlayer.getVolume();
        ytPlayer.mute();
        volumeSlider.value = 0;
        volumeBtn.innerHTML = VOLUME_ICON.muted;
      }
    });

    document.getElementById('speedBtn').addEventListener('click', function () {
      speedIndex = (speedIndex + 1) % SPEED_STEPS.length;
      const rate = SPEED_STEPS[speedIndex];
      ytPlayer.setPlaybackRate(rate);
      this.textContent = rate + 'x';
    });

    setupFullscreenButton();
  }

  /* ---------------- تكبير/تصغير الفيديو (Fullscreen) ---------------- */
  function setupFullscreenButton() {
    const wrap = document.getElementById('videoWrap');
    const btn = document.getElementById('fullscreenBtn');
    if (!wrap || !btn) return;

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function updateIcon() {
      btn.innerHTML = isFullscreen() ? FULLSCREEN_ICON.exit : FULLSCREEN_ICON.enter;
      btn.setAttribute('aria-label', isFullscreen() ? 'تصغير الفيديو' : 'تكبير الفيديو');
    }

    btn.addEventListener('click', function () {
      if (!isFullscreen()) {
        if (wrap.requestFullscreen) wrap.requestFullscreen();
        else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
        else if (wrap.webkitEnterFullscreen) wrap.webkitEnterFullscreen(); // iOS Safari (فيديو فقط)
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    });

    // تدوير الشاشة تلقائيًا للوضع الأفقي عند التكبير على الموبايل (يعمل على أندرويد/كروم غالبًا، وسافاري iOS لا يدعم قفل الاتجاه من المتصفح)
    function tryLockLandscape() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function () {});
      }
    }
    function tryUnlockOrientation() {
      if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch (e) {}
      }
    }
    document.addEventListener('fullscreenchange', function () {
      if (isFullscreen()) tryLockLandscape(); else tryUnlockOrientation();
    });
    document.addEventListener('webkitfullscreenchange', function () {
      if (isFullscreen()) tryLockLandscape(); else tryUnlockOrientation();
    });

    document.addEventListener('fullscreenchange', updateIcon);
    document.addEventListener('webkitfullscreenchange', updateIcon);
  }

  function togglePlay() {
    if (!ytReady) return;
    const state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
    else ytPlayer.playVideo();
  }

  /* ---------------- إخفاء/إظهار أدوات التحكم تلقائيًا بعد 5 ثوانٍ من عدم التفاعل ---------------- */
  let hideControlsTimer = null;
  function scheduleHideControls() {
    clearTimeout(hideControlsTimer);
    hideControlsTimer = setTimeout(function () {
      if (ytPlayer && ytReady && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
        const wrap = document.getElementById('videoWrap');
        if (wrap) wrap.classList.add('controls-hidden');
      }
    }, 5000);
  }
  function showControlsBar() {
    const wrap = document.getElementById('videoWrap');
    if (wrap) wrap.classList.remove('controls-hidden');
    scheduleHideControls();
  }
  function hideControlsBar() {
    clearTimeout(hideControlsTimer);
    const wrap = document.getElementById('videoWrap');
    if (wrap) wrap.classList.add('controls-hidden');
  }
  function toggleControlsVisibility() {
    const wrap = document.getElementById('videoWrap');
    if (!wrap) return;
    if (wrap.classList.contains('controls-hidden')) showControlsBar();
    else hideControlsBar();
  }

  /* ---------------- تقديم/ترجيع 10 ثوانٍ بالضغط المزدوج + تسريع ×2 بالضغط المطوّل ---------------- */
  function seekBy(deltaSeconds) {
    if (!ytPlayer || !ytReady) return;
    const duration = ytPlayer.getDuration() || 0;
    const current = ytPlayer.getCurrentTime() || 0;
    const next = Math.max(0, Math.min(duration, current + deltaSeconds));
    ytPlayer.seekTo(next, true);
  }

  function flashSeekIndicator(side) {
    const wrap = document.getElementById('videoWrap');
    if (!wrap) return;
    const el = document.createElement('div');
    el.className = 'seek-flash ' + side;
    const arrow = side === 'fwd'
      ? '<svg viewBox="0 0 512 512" fill="currentColor" width="24" height="24"><path d="M470.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-9.2-9.2-22.9-11.9-34.9-6.9s-19.8 16.6-19.8 29.6l0 82.4C118.8 195.6 0 313.4 0 458.6 0 469.3 6.5 479 16.3 483.2s21.5 2.1 29.3-5.7C88.6 434.6 158.9 400 256 400l0 80c0 12.9 7.8 24.6 19.8 29.6s25.7 2.2 34.9-6.9l160-160z"/></svg>'
      : '<svg viewBox="0 0 512 512" fill="currentColor" width="24" height="24"><path d="M41.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c9.2 9.2 22.9 11.9 34.9 6.9s19.8-16.6 19.8-29.6l0-82.4c137.1 5.3 205.9 39.9 249.6 91.5 7.7 7.9 19.6 10.7 30.3 5.7s16.3-13.9 16.3-24.6c0-145.2-118.8-263-256-267.7L256 32c0-12.9-7.8-24.6-19.8-29.6s-25.7-2.2-34.9 6.9l-160 160z"/></svg>';
    el.innerHTML = arrow + '<span>10 ثوانٍ</span>';
    wrap.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    setTimeout(function () {
      el.classList.remove('show');
      setTimeout(function () { el.remove(); }, 200);
    }, 550);
  }

  function setupTapGestures() {
    const catcher = document.getElementById('playerClickCatcher');
    const wrap = document.getElementById('videoWrap');
    if (!catcher || !wrap) return;

    let tapTimer = null;
    let lastTapTime = 0;
    let lastTapSide = null;
    let longPressTimer = null;
    let longPressActive = false;
    let previousRate = 1;
    let startX = 0, startY = 0;

    catcher.addEventListener('pointerdown', function (e) {
      startX = e.clientX; startY = e.clientY;
      longPressActive = false;
      longPressTimer = setTimeout(function () {
        longPressActive = true;
        previousRate = ytPlayer.getPlaybackRate();
        ytPlayer.setPlaybackRate(2);
        wrap.classList.add('speed-boost-active');
      }, 400);
    });

    catcher.addEventListener('pointermove', function (e) {
      if (!longPressTimer) return;
      if (Math.abs(e.clientX - startX) > 12 || Math.abs(e.clientY - startY) > 12) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    });

    function endPress(e) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
      if (longPressActive) {
        longPressActive = false;
        wrap.classList.remove('speed-boost-active');
        if (ytPlayer && ytReady) ytPlayer.setPlaybackRate(previousRate || 1);
        return;
      }
      const rect = catcher.getBoundingClientRect();
      const clientX = (e.clientX !== undefined && e.clientX !== 0) ? e.clientX : startX;
      const x = clientX - rect.left;
      const side = x > rect.width / 2 ? 'right' : 'left';
      const now = Date.now();
      if (now - lastTapTime < 320 && side === lastTapSide) {
        clearTimeout(tapTimer);
        tapTimer = null;
        lastTapTime = 0; lastTapSide = null;
        if (side === 'right') { seekBy(10); flashSeekIndicator('fwd'); }
        else { seekBy(-10); flashSeekIndicator('back'); }
      } else {
        lastTapTime = now; lastTapSide = side;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(function () {
          // نتجاهل أول لمسة تصل فور بدء التشغيل (قد تكون بقايا نفس نقرة "تشغيل")
          // حتى لا تختفي الأدوات بمجرد ظهورها؛ بدل ما نخفيها، نبقيها ظاهرة ونجدّد المؤقّت
          if (Date.now() - playbackStartedAt < 700) {
            showControlsBar();
          } else {
            toggleControlsVisibility();
          }
          lastTapTime = 0; lastTapSide = null;
        }, 320);
      }
    }

    catcher.addEventListener('pointerup', endPress);
    catcher.addEventListener('pointercancel', function () {
      clearTimeout(longPressTimer); longPressTimer = null;
      if (longPressActive && ytPlayer && ytReady) ytPlayer.setPlaybackRate(previousRate || 1);
      longPressActive = false;
      wrap.classList.remove('speed-boost-active');
    });
  }

  function onPlayerStateChange(e) {
    const btn = document.getElementById('playPauseBtn');
    const overlay = document.getElementById('videoEndOverlay');
    if (btn) btn.innerHTML = (e.data === YT.PlayerState.PLAYING) ? PLAY_PAUSE_ICON.pause : PLAY_PAUSE_ICON.play;
    if (overlay) {
      if (e.data === YT.PlayerState.ENDED) overlay.classList.add('show');
      else if (e.data === YT.PlayerState.PLAYING) overlay.classList.remove('show');
    }
    if (e.data === YT.PlayerState.PLAYING) scheduleHideControls();
    else showControlsBar();
  }

  function updateProgress() {
    if (!ytReady || seeking) return;
    const fill = document.getElementById('progressFill');
    const timeEl = document.getElementById('timeDisplay');
    if (!fill || !timeEl) return; // انتقل المستخدم لصفحة تانية
    const duration = ytPlayer.getDuration() || 0;
    const current = ytPlayer.getCurrentTime() || 0;
    const pct = (duration ? (current / duration) * 100 : 0);
    fill.style.width = pct + '%';
    const track = document.getElementById('progressTrack');
    if (track) track.style.setProperty('--fill', pct + '%');
    timeEl.textContent = formatPlayerTime(current) + ' / ' + formatPlayerTime(duration);
    trackWatchProgress(pct);
  }

  function formatPlayerTime(sec) {
    sec = Math.floor(sec || 0);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    const mm = h > 0 ? String(m).padStart(2, '0') : m;
    const ss = String(s).padStart(2, '0');
    return h > 0 ? (h + ':' + mm + ':' + ss) : (mm + ':' + ss);
  }

  /* ---------------- زر المشاركة (سلسلة بدائل حقيقية تعمل فعليًا) ---------------- */
  function setupShareButton() {
    const btn = document.getElementById('shareBtn');
    const originalHtml = btn.innerHTML;

    function flash(text, iconName) {
      btn.innerHTML = icon(iconName, 'icon-sm') + ' ' + text;
      setTimeout(function () { btn.innerHTML = originalHtml; }, 2200);
    }

    btn.addEventListener('click', function () {
      const url = window.location.href;
      const title = document.getElementById('videoTitle').textContent;

      // 1) واجهة المشاركة الأصلية للجهاز (تعمل على الموبايل بشكل خاص)
      if (navigator.share) {
        navigator.share({ title: title, url: url })
          .then(function () { flash('تمت المشاركة', 'check'); })
          .catch(function (err) {
            if (err && err.name === 'AbortError') return; // المستخدم ألغى المشاركة بنفسه
            copyToClipboard();
          });
        return;
      }
      copyToClipboard();

      function copyToClipboard() {
        // 2) نسخ الرابط عبر Clipboard API (يحتاج اتصال آمن HTTPS)
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url)
            .then(function () { flash('تم نسخ الرابط', 'check'); })
            .catch(function () { manualFallback(); });
        } else {
          manualFallback();
        }
      }

      function manualFallback() {
        // 3) بديل أخير يعمل في كل الحالات: صندوق نص جاهز للنسخ اليدوي
        window.prompt('انسخ رابط الفيديو من هنا:', url);
      }
    });
  }

  /* ---------------- التعليقات (تُقرأ من الجميع، والرد عليها للمسؤول فقط) ---------------- */
  function commentsRef() {
    return db.ref('competitions/' + compId + '/lessons/' + lessonId + '/videos/' + videoId + '/comments');
  }

  function loadComments() {
    commentsRef().on('value', function (snap) {
      const data = snap.val() || {};
      const ids = Object.keys(data).sort(function (a, b) { return (data[a].createdAt || 0) - (data[b].createdAt || 0); });
      const list = document.getElementById('commentList');
      if (ids.length === 0) {
        list.innerHTML = '<div class="comment-empty">' + icon('comment', 'icon-lg') +
          '<p>لا توجد تعليقات بعد، كن أول من يسأل أو يعلّق.</p></div>';
        return;
      }
      list.innerHTML = ids.map(function (id) {
        const c = data[id];
        const initial = (c.name || '؟').trim().charAt(0);
        const reply = c.adminReply;

        let replyHtml = '';
        if (reply) {
          replyHtml =
            '<div class="comment-card" style="margin-inline-start:28px; margin-top:8px; background:var(--teal-pale); border-color:rgba(184, 97, 20,0.3);">' +
              '<div class="c-head"><span class="c-avatar" style="background:linear-gradient(135deg, var(--teal-light), var(--teal));">' + icon('shield', 'icon-sm') + '</span>' +
              '<span class="c-name">إدارة المنصة</span>' +
              '<span class="c-time">' + formatArabicDate(reply.createdAt) + '</span></div>' +
              '<p class="c-text">' + escapeHtml(reply.text) + '</p>' +
            '</div>';
        } else if (currentUserData.isAdmin) {
          replyHtml =
            '<div style="margin-inline-start:28px; margin-top:8px; display:flex; gap:6px;">' +
              '<input type="text" class="reply-input" data-comment="' + id + '" placeholder="اكتب ردًا كإدارة المنصة..." style="flex:1; padding:8px 12px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:inherit; font-size:16px;">' +
              '<button class="btn btn-gold btn-xs reply-send-btn" data-comment="' + id + '">' + icon('reply', 'icon-sm') + ' رد</button>' +
            '</div>';
        }

        return '<div class="comment-card">' +
          '<div class="c-head"><span class="c-avatar">' + escapeHtml(initial) + '</span>' +
          '<span class="c-name">' + escapeHtml(c.name || 'مستخدم') + '</span>' +
          '<span class="c-time">' + formatArabicDate(c.createdAt) + '</span></div>' +
          '<p class="c-text">' + escapeHtml(c.text) + '</p>' +
        '</div>' + replyHtml;
      }).join('');

      if (currentUserData.isAdmin) {
        list.querySelectorAll('.reply-send-btn').forEach(function (btn) {
          btn.addEventListener('click', function () { sendAdminReply(btn.dataset.comment); });
        });
        list.querySelectorAll('.reply-input').forEach(function (input) {
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') sendAdminReply(input.dataset.comment);
          });
        });
      }
    });
  }

  function sendComment() {
    const input = document.getElementById('commentInput');
    const btn = document.getElementById('sendCommentBtn');
    const msg = document.getElementById('commentMsg');
    const text = input.value.trim();

    msg.classList.remove('show');

    if (!text) {
      input.classList.remove('shake');
      void input.offsetWidth; // إعادة تشغيل الأنيميشن لو المستخدم حاول أكتر من مرة
      input.classList.add('shake');
      input.focus();
      return;
    }

    const originalBtnHtml = btn.innerHTML;
    input.disabled = true;
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span>';

    commentsRef().push({
      uid: currentUser.uid,
      name: currentUserData.name || 'مستخدم',
      text: text,
      createdAt: firebase.database.ServerValue.TIMESTAMP
    }).then(function () {
      input.value = '';
      input.disabled = false;
      btn.disabled = false;
      btn.innerHTML = originalBtnHtml;
      input.focus();
    }).catch(function (err) {
      msg.innerHTML = icon('exclamation-triangle', 'icon-sm') + ' تعذر إرسال التعليق' + (err && err.message ? ': ' + err.message : '') + '، حاول مرة أخرى';
      msg.classList.add('show');
      input.disabled = false;
      btn.disabled = false;
      btn.innerHTML = originalBtnHtml;
    });
  }

  function sendAdminReply(commentId) {
    const input = document.querySelector('.reply-input[data-comment="' + commentId + '"]');
    const btn = document.querySelector('.reply-send-btn[data-comment="' + commentId + '"]');
    const text = input.value.trim();

    if (!text) {
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('shake');
      input.focus();
      return;
    }

    const originalBtnHtml = btn.innerHTML;
    input.disabled = true;
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span>';

    const commentRef = commentsRef().child(commentId);
    commentRef.once('value').then(function (snap) {
      const comment = snap.val();
      return commentRef.child('adminReply').set({
        text: text,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      }).then(function () {
        if (comment && comment.uid && comment.uid !== currentUser.uid) {
          return db.ref('notifications/' + comment.uid).push({
            type: 'reply',
            title: 'تم الرد على تعليقك',
            body: text.length > 60 ? text.slice(0, 60) + '…' : text,
            link: 'video.html?comp=' + compId + '&lesson=' + lessonId + '&video=' + videoId,
            read: false,
            createdAt: firebase.database.ServerValue.TIMESTAMP
          }).catch(function (notifErr) {
            console.error('تعذر إرسال إشعار الرد:', notifErr);
          });
        }
      });
      // عند النجاح تُعاد قائمة التعليقات كاملةً تلقائيًا (الاستماع الحي)، فلا داعي لإعادة ضبط الزر يدويًا
    }).catch(function (err) {
      console.error('تعذر إرسال الرد:', err);
      input.disabled = false;
      btn.disabled = false;
      btn.innerHTML = originalBtnHtml;
      btn.style.color = 'var(--danger)';
      setTimeout(function () { btn.style.color = ''; }, 1600);
    });
  }
</script>
</body>
</html>
