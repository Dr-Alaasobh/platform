<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("asb_theme")||"light")</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>الفيديو — منصة د.علاء صبح</title>
<link rel="stylesheet" href="style.css?v=11">
<link rel="stylesheet" href="theme.css?v=3">
<link rel="stylesheet" href="shell.css?v=2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* صفحة الفيديو — تصميم جديد بالكامل، كل الكلاسات بادئة بـ vp- */
.vp{max-width:1280px;margin:0 auto;padding:6px 0 48px}
.vp *{box-sizing:border-box}
.vp button{font-family:inherit}
.vp-crumb{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;font-weight:700;color:var(--text-muted);flex-wrap:wrap}
.vp-back{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--card-bg);border:1px solid var(--border);color:var(--primary);text-decoration:none;transition:.15s}
.vp-back:hover{border-color:var(--primary-light);background:var(--primary-tint)}
.vp-crumb .sep{opacity:.4}
.vp-head{margin-bottom:16px}
.vp-eyebrow{display:inline-flex;align-items:center;gap:7px;margin-bottom:6px;font-size:12.5px;font-weight:800;color:var(--teal-dark);letter-spacing:.2px}
:root[data-theme="dark"] .vp-eyebrow{color:var(--teal)}
.vp-title{margin:0;font-family:'Cairo',sans-serif;font-weight:800;font-size:clamp(21px,3.2vw,30px);line-height:1.45;color:var(--text)}
.vp-grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;align-items:start}
.vp-card{background:var(--card-bg);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
.vp-pad{padding:20px}

/* المشغّل */
.vp-player{position:relative;aspect-ratio:16/9;background:#050E1F;border-radius:20px;overflow:hidden;box-shadow:0 22px 50px rgba(6,20,43,.32);user-select:none;-webkit-user-select:none}
.vp-player:fullscreen{border-radius:0;aspect-ratio:auto}
.vp-player iframe,.vp-player #ytPlayerMount{position:absolute;inset:0;width:100%;height:100%;border:0}
.vp-cover{position:absolute;inset:0;z-index:5;cursor:pointer;background:#050E1F}
.vp-cover.is-hidden{display:none}
.vp-cover img{width:100%;height:100%;object-fit:cover;opacity:.8;transition:transform .6s}
.vp-cover:hover img{transform:scale(1.03)}
.vp-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,14,31,.75),rgba(5,14,31,.1) 60%)}
.vp-bigplay{position:absolute;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;border:0;background:var(--gradient-gold);color:#04251D;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 34px rgba(15,159,130,.55);cursor:pointer;transition:transform .2s}
.vp-bigplay i{margin-inline-end:-3px}
.vp-bigplay::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(52,211,168,.5);animation:vppulse 2.2s ease-out infinite}
.vp-cover:hover .vp-bigplay{transform:translate(-50%,-50%) scale(1.08)}
.vp-chip{position:absolute;z-index:2;bottom:14px;right:14px;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:rgba(5,14,31,.7);backdrop-filter:blur(6px);color:#fff;font-size:12.5px;font-weight:700}
@keyframes vppulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.45);opacity:0}}
.vp-catch{position:absolute;inset:0 0 64px 0;z-index:3;touch-action:manipulation}
.vp-ctrl{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:34px 16px 10px;background:linear-gradient(0deg,rgba(5,14,31,.92),transparent);color:#fff;transition:opacity .25s}
.vp-player:not(.is-playing) .vp-ctrl{display:none}
.vp-player.controls-hidden .vp-ctrl{opacity:0;pointer-events:none}
.vp-player.controls-hidden{cursor:none}
.vp-seek{position:relative;height:20px;cursor:pointer;display:flex;align-items:center;direction:ltr;touch-action:none}
.vp-seek-bar{position:relative;width:100%;height:4px;border-radius:999px;background:rgba(255,255,255,.26);transition:height .15s}
.vp-seek:hover .vp-seek-bar{height:6px}
.vp-seek-bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--teal-light))}
.vp-seek-bar::after{content:"";position:absolute;top:50%;left:var(--p,0%);width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);transform:scale(0);transition:transform .15s}
.vp-seek:hover .vp-seek-bar::after,.vp-player.is-seeking .vp-seek-bar::after{transform:scale(1)}
.vp-row{display:flex;align-items:center;gap:4px;direction:rtl}
.vp-b{position:relative;background:none;border:0;color:#fff;width:40px;height:40px;border-radius:12px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vp-b:hover{background:rgba(255,255,255,.16)}
.vp-b:focus-visible{outline:2px solid var(--teal-light)}
.vp-b em{position:absolute;font-style:normal;font-size:8.5px;font-weight:800;top:50%;left:50%;transform:translate(-50%,-44%)}
.vp-pp{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);font-size:17px}
.vp-time{font-size:12.5px;font-weight:700;direction:ltr;opacity:.92;margin-inline-start:8px;font-variant-numeric:tabular-nums}
.vp-sp{flex:1}
.vp-vol{width:78px;accent-color:var(--teal-light)}
.vp-rate{min-width:50px;width:auto;padding:0 10px;font-weight:800;font-size:13px;background:rgba(255,255,255,.12)}
.vp-end{position:absolute;inset:0;z-index:7;background:rgba(5,14,31,.84);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center}
.vp-end.show{display:flex}
.vp-end-in{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;justify-content:center;padding:16px}
.vp-replay,.vp-next{display:inline-flex;gap:10px;align-items:center;padding:13px 22px;border-radius:14px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;border:1.5px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff}
.vp-replay:hover{background:rgba(255,255,255,.18)}
.vp-next{background:var(--gradient-gold);border:0;color:#04251D;flex-direction:row;max-width:280px}
.vp-next span{display:flex;flex-direction:column;text-align:right;line-height:1.4;min-width:0}
.vp-next small{font-size:11.5px;font-weight:700;opacity:.75}
.vp-next b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vp-flash{position:absolute;top:50%;transform:translateY(-50%);z-index:8;padding:14px 18px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .15s;pointer-events:none}
.vp-flash.show{opacity:1}.vp-flash.fwd{right:10%}.vp-flash.back{left:10%}
.vp-boost{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:8;padding:6px 15px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:800;display:none}
.vp-player.speed-boost-active .vp-boost{display:block}
.vp-player .video-watermark{z-index:4;pointer-events:none}

/* الإجراءات */
.vp-actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.vp-act{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--primary);font:inherit;font-size:13.5px;font-weight:700;text-decoration:none;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.vp-act:hover{border-color:var(--primary-light);background:var(--primary-tint);transform:translateY(-1px)}
.vp-act.on{background:var(--teal-pale);border-color:var(--teal);color:var(--teal-dark)}
:root[data-theme="dark"] .vp-act.on{color:var(--teal)}
.vp-act.main{background:var(--gradient-primary);border:0;color:#fff;box-shadow:var(--shadow)}
.vp-act.main:hover{filter:brightness(1.12)}
.vp-act.go{background:var(--gradient-gold);border:0;color:#04251D;margin-inline-start:auto}

/* التبويبات */
.vp-tabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--border)}
.vp-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 10px;border:0;border-radius:12px;background:none;color:var(--text-muted);font-size:14.5px;font-weight:800;cursor:pointer;transition:.15s}
.vp-tab:hover{background:var(--bg)}
.vp-tab.on{background:var(--primary-tint);color:var(--primary-light)}
:root[data-theme="dark"] .vp-tab.on{color:var(--primary)}
.vp-tab .n{min-width:22px;padding:1px 7px;border-radius:999px;background:var(--cream-deep);color:var(--text);font-size:11.5px}
.vp-pane[hidden]{display:none}
.vp-note{margin:0 0 16px;font-size:14px;line-height:2;color:var(--text-muted);white-space:pre-wrap}

/* الإحصائيات */
.vp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.vp-stat{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--border)}
.vp-stat .ico{flex-shrink:0;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--teal-pale);color:var(--teal-dark);font-size:15px}
:root[data-theme="dark"] .vp-stat .ico{color:var(--teal)}
.vp-stat div{min-width:0}
.vp-stat small{display:block;font-size:12px;color:var(--text-muted);font-weight:600}
.vp-stat b{font-family:'Cairo',sans-serif;font-size:16.5px;color:var(--text)}
.vp-meter{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--bg);border:1px solid var(--border)}
.vp-meter-h{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--text);margin-bottom:9px}
.vp-bar{height:8px;border-radius:999px;background:var(--cream-deep);overflow:hidden}
.vp-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary-light),var(--teal));transition:width .4s}
.vp-hint{margin:10px 0 0;font-size:12.5px;line-height:1.8;color:var(--text-muted)}

/* التعليقات */
.vp-cform{display:flex;gap:10px}
.vp-cform input{flex:1;min-width:0;padding:13px 16px;font:inherit;font-size:14px;border-radius:999px}
.vp-send{padding:0 24px;border:0;border-radius:999px;background:var(--gradient-primary);color:#fff;font:inherit;font-weight:800;cursor:pointer}
.vp-send:disabled{opacity:.6}
.vp-err{display:none;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--danger)}.vp-err.show{display:block}
.vp-list{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.vp-c{display:flex;gap:12px}
.vp-av{flex-shrink:0;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--primary-tint);color:var(--primary-light);font-weight:800}
.vp-c.admin .vp-av{background:var(--gradient-gold);color:#04251D}
.vp-cb{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:4px 16px 16px 16px;padding:11px 15px}
.vp-c.admin{margin-inline-start:36px}.vp-c.admin .vp-cb{background:var(--teal-pale);border-color:transparent}
.vp-cn{font-size:13px;font-weight:800;color:var(--text)}.vp-cn small{font-weight:600;color:var(--text-muted);margin-inline-start:8px}
.vp-ct{margin:4px 0 0;font-size:14px;line-height:1.85;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.vp-reply{display:flex;gap:8px;margin-inline-start:36px}
.vp-reply input{flex:1;min-width:0;padding:9px 14px;font:inherit;font-size:13px;border-radius:999px}
.vp-reply button{padding:0 18px;border:0;border-radius:999px;background:var(--gradient-gold);color:#04251D;font:inherit;font-weight:800;cursor:pointer}
.vp-empty{text-align:center;padding:30px 10px;color:var(--text-muted);font-size:13.5px}
.shake{animation:vpshake .35s}
@keyframes vpshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* قائمة المحاضرة */
.vp-side{position:sticky;top:84px}
.vp-side .vp-card{overflow:hidden}
.vp-sh0{padding:18px 18px 14px;background:var(--gradient-primary);color:#fff}
.vp-lt{margin:0;font-size:16px;font-weight:800;line-height:1.55;color:#fff}
.vp-lmeta{margin:6px 0 12px;font-size:12px;font-weight:600;color:rgba(255,255,255,.75)}
.vp-lbar{height:6px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
.vp-lbar i{display:block;height:100%;border-radius:999px;background:var(--teal-light)}
.vp-ld{margin:12px 0 0;font-size:12.5px;line-height:1.85;color:rgba(255,255,255,.82)}
.vp-ld .vp-more{background:none;border:0;padding:0;font:inherit;font-weight:800;color:var(--teal-light);cursor:pointer;margin-inline-start:4px}
.vp-listbox{padding:10px;max-height:calc(100vh - 330px);overflow:auto}
.vp-sh{margin:10px 8px 6px;font-size:12px;font-weight:800;color:var(--text-muted)}
.vp-it{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;text-decoration:none;color:var(--text);font-size:13.5px;font-weight:700;border:1.5px solid transparent}
a.vp-it:hover{background:var(--bg)}
.vp-it.active{background:var(--primary-tint);border-color:var(--primary-light)}
.vp-it .no{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--cream-deep);color:var(--text-muted);font-size:12px;font-weight:800}
.vp-it.active .no{background:var(--primary-light);color:#fff}
.vp-it.done .no{background:var(--teal-pale);color:var(--success)}
.vp-it.exam .no{background:var(--primary-tint);color:var(--primary-light)}
.vp-it span.t{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.55}
.vp-it .ok{color:var(--success)}

.vp-gate{text-align:center;padding:56px 20px}
.vp-gate i{font-size:38px;color:var(--teal);margin-bottom:14px}
.vp-gate h3{margin:0 0 6px;color:var(--text)}.vp-gate p{margin:0 0 16px;color:var(--text-muted);font-size:14px;line-height:1.9}
.vp-gate a{display:inline-flex;padding:11px 24px;border-radius:999px;background:var(--gradient-primary);color:#fff;text-decoration:none;font-weight:800}

@media (max-width:980px){
  .vp-grid{grid-template-columns:1fr}
  .vp-side{position:static}
  .vp-listbox{max-height:none}
  .vp-player{border-radius:14px}
}
@media (max-width:560px){
  .vp-vol{display:none}.vp-b{width:36px;height:36px}.vp-pp{width:40px;height:40px}.vp-bigplay{width:66px;height:66px;font-size:23px}
  .vp-stats{grid-template-columns:1fr}
  .vp-cform{flex-direction:column}.vp-send{padding:12px}
  .vp-act{flex:1 1 calc(50% - 10px);justify-content:center}.vp-act.go{margin-inline-start:0;flex-basis:100%}
  .vp-time{margin-inline-start:2px;font-size:11.5px}
  .vp-pad{padding:16px}
}
@media (prefers-reduced-motion:reduce){.vp *{transition:none!important;animation:none!important}}
</style>

<body>
<header class="nv" id="appHeader"></header>

<main class="page"><div class="vp">
  <nav class="vp-crumb"><a class="vp-back" id="backLink" href="competition.html"><i class="fas fa-arrow-right"></i> الرجوع للكورس</a></nav>
  <div class="vp-grid">
    <div class="vp-main">
      <div class="vp-head"><div class="vp-eyebrow" id="eyebrow"><i class="fas fa-layer-group"></i> المحاضرة</div><h1 class="vp-title" id="videoTitle">جارٍ التحميل...</h1></div>
      <div id="content"><div class="center-loading"><div class="loader"></div></div></div>
    </div>
    <aside class="vp-side" id="videoSidebar" style="display:none"></aside>
  </div>
</div></main>

<footer class="ft" id="siteFooter"></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=11"></script>
<script src="icons.js?v=3"></script>
<script src="app-shell.js?v=8"></script>
<script src="player.js?v=1"></script>
<script>
const params = new URLSearchParams(location.search);
const compId = params.get('comp'), lessonId = params.get('lesson'), videoId = params.get('video');
if (!compId || !lessonId || !videoId) location.href = 'home.html';
const $ = function (id) { return document.getElementById(id); };
const qs = encodeURIComponent;
$('backLink').href = 'competition.html?id=' + qs(compId);

let currentUser = null, currentUserData = null;
const MAX_VIEWS = 30;          // الحد الأقصى للمشاهدات لكل فيديو
const VIEW_THRESHOLD = 0.8;    // المشاهدة بتتحسب لما الطالب يشوف 80% من محتوى الفيديو فعليًا
let progRef = null, maxViews = MAX_VIEWS, viewsUsed = 0, blocked = false, viewCounted = false;
/* تتبّع المشاهدة الفعلية: بنسجّل ثواني الفيديو اللي اتشافت (مش الوقت اللي الطالب قعده) فالسرعة ملهاش تأثير */
let seen = new Set(), lastPos = null, lastWall = 0;
let maxPct = 0, flushedPct = 0, watchBase = 0, watchAccum = 0, flushedAccum = 0;

function gate(icon, title, text, link) {
  $('videoTitle').textContent = title;
  $('content').innerHTML = '<div class="vp-card vp-gate"><i class="fas fa-' + icon + '"></i><h3>' + title + '</h3><p>' + text + '</p>' +
    (link ? '<a href="competition.html?id=' + qs(compId) + '">الذهاب لصفحة المحتوى</a>' : '') + '</div>';
}

requireAuth(function (user, ud) {
  currentUser = user; currentUserData = ud;
  renderAppHeader(user, ud, { showPoints: true });
  renderFooter();
  load();
});

function load() {
  db.ref('competitions/' + compId).once('value').then(function (snap) {
    if (!snap.exists()) { location.href = 'home.html'; return; }
    const lessons = snap.val().lessons || {}, lesson = lessons[lessonId];
    if (!lesson || !lesson.videos || !lesson.videos[videoId]) { location.href = 'competition.html?id=' + qs(compId); return; }
    return db.ref('userEnrollments/' + currentUser.uid + '/' + compId).once('value').then(function (e) {
      if (!e.exists()) { gate('lock', 'محتوى مغلق', 'اشترك في هذا المحتوى من صفحته لتشاهد هذا الفيديو.', true); return; }
      return db.ref('userProgress/' + currentUser.uid + '/' + compId).once('value').then(function (p) {
        const prog = p.val() || {}, lp = prog[lessonId] || {};
        const access = getLessonAccessState(lessons, prog, lessonId);
        if (!access.allowed) { gate('lock', 'هذا المحتوى مغلق', access.reason === 'release' ? 'هذه المحاضرة لم يحن معادها بعد.' : 'أكمِل المحاضرة السابقة أولًا.'); return; }
        if (isItemLocked(lesson, lp, 'video', videoId)) { gate('lock', 'هذا المحتوى مغلق', 'لازم تحل الاختبار الإجباري اللي قبله الأول.'); return; }
        const video = lesson.videos[videoId];
        $('videoTitle').textContent = video.title || 'فيديو الشرح';
        renderVideo(video, lesson, (lp.videos && lp.videos[videoId]) || {});
        renderSide(lessons, lesson, lp);
      });
    });
  });
}

/* ===== الصفحة ===== */
function fmtMin(m) { return Math.max(1, Math.round(m)) + ' دقيقة'; }
function fmtWatch(s) { s = Math.floor(s || 0); return s < 60 ? s + ' ثانية' : Math.round(s / 60) + ' دقيقة'; }
function fmtTime(sec) {
  sec = Math.floor(sec || 0);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = String(sec % 60).padStart(2, '0');
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + s : m + ':' + s;
}
function vHref(v) { return 'video.html?comp=' + qs(compId) + '&lesson=' + qs(lessonId) + '&video=' + qs(v); }
function setTab(t) {
  document.querySelectorAll('.vp-tab').forEach(function (b) { const on = b.dataset.t === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  document.querySelectorAll('.vp-pane').forEach(function (p) { p.hidden = p.dataset.t !== t; });
}

function renderVideo(video, lesson, vprog) {
  const S = ASBPlayer.resolve(video.url);
  curVideo = video;
  progRef = db.ref('userProgress/' + currentUser.uid + '/' + compId + '/' + lessonId);
  maxViews = MAX_VIEWS;
  viewsUsed = Number(vprog.viewsUsed) || 0;
  blocked = viewsUsed >= maxViews;
  viewCounted = false; seen = new Set(); lastPos = null;
  maxPct = Number(vprog.maxWatchedPercent) || 0; flushedPct = maxPct;
  watchBase = Number(vprog.totalWatchSeconds) || 0; watchAccum = 0; flushedAccum = 0;

  const vids = Object.keys(lesson.videos || {}), nextId = vids[vids.indexOf(videoId) + 1] || null;
  const nextTitle = nextId ? (lesson.videos[nextId].title || 'فيديو الشرح') : '';
  const dur = Number(video.durationMinutes) > 0 ? fmtMin(Number(video.durationMinutes)) : (blocked ? 'غير محددة' : '—');

  let player;
  if (S && !blocked) {
    player =
      '<div class="vp-player" id="videoWrap">' +
        '<div class="vp-cover" id="videoCover">' + (S.poster ? '<img src="' + S.poster + '" alt="" onerror="this.remove()">' : '') +
          '<button type="button" class="vp-bigplay" aria-label="تشغيل الفيديو"><i class="fas fa-play"></i></button>' +
          (dur !== '—' ? '<span class="vp-chip"><i class="far fa-clock"></i> ' + dur + '</span>' : '') + '</div>' +
        '<div class="vp-end" id="endOv"><div class="vp-end-in">' +
          '<button type="button" class="vp-replay" id="replayBtn"><i class="fas fa-rotate-left"></i> إعادة المشاهدة</button>' +
          (nextId ? '<a class="vp-next" href="' + vHref(nextId) + '"><i class="fas fa-forward-step"></i><span><small>الفيديو التالي</small><b>' + escapeHtml(nextTitle) + '</b></span></a>' : '') +
        '</div></div>' +
      '</div>';
  } else if (blocked) {
    player = '<div class="vp-card vp-gate"><i class="fas fa-lock"></i><h3>استنفدت عدد المشاهدات المتاحة</h3><p>استخدمت كل مشاهداتك المسموح بها لهذه المحاضرة (' + maxViews + ' مشاهدات). تقدر تراجع تفاصيلها تحت.</p></div>';
  } else player = '<div class="vp-card vp-gate"><i class="fas fa-triangle-exclamation"></i><h3>تعذر تحميل الفيديو</h3><p>رابط الفيديو غير صالح. بلّغ المسؤول.</p></div>';

  const desc = (lesson.description || '').trim();
  const stat = function (ico, label, val, id) { return '<div class="vp-stat"><span class="ico"><i class="fas fa-' + ico + '"></i></span><div><small>' + label + '</small><b id="' + id + '">' + val + '</b></div></div>'; };
  $('content').innerHTML = player +
    '<div class="vp-actions" id="vpActions"></div>' +
    '<div class="vp-card">' +
      '<div class="vp-tabs" role="tablist">' +
        '<button type="button" class="vp-tab on" data-t="info" role="tab" onclick="setTab(\'info\')"><i class="fas fa-circle-info"></i> نظرة عامة</button>' +
        '<button type="button" class="vp-tab" data-t="cmt" role="tab" onclick="setTab(\'cmt\')"><i class="fas fa-comments"></i> الأسئلة والتعليقات <span class="n" id="cmtCount">0</span></button>' +
      '</div>' +
      '<div class="vp-pane vp-pad" data-t="info">' + (desc ? '<p class="vp-note">' + escapeHtml(desc) + '</p>' : '') +
        '<div class="vp-stats">' +
          stat('clock', 'مدة الفيديو', dur, 'statDuration') +
          stat('eye', 'المشاهدات', viewsUsed + ' من ' + maxViews, 'statViews') +
          stat('hourglass-half', 'وقت المشاهدة', fmtWatch(watchBase), 'statWatch') +
        '</div>' +
        '<div class="vp-meter"><div class="vp-meter-h"><span>نسبة مشاهدتك للمحاضرة</span><span id="pctLabel">' + Math.round(maxPct) + '%</span></div>' +
          '<div class="vp-bar"><i id="pctFill" style="width:' + Math.round(maxPct) + '%"></i></div>' +
          '<p class="vp-hint">بتتحسب مشاهدة واحدة لما تشوف 80% من الفيديو فعليًا، من غير ما يفرق سرعة التشغيل أو التقديم.</p></div>' +
      '</div>' +
      '<div class="vp-pane vp-pad" data-t="cmt" hidden>' +
        '<div class="vp-cform"><input type="text" id="commentInput" placeholder="اكتب سؤالك أو تعليقك هنا..." maxlength="400"><button class="vp-send" id="sendCommentBtn">إرسال</button></div>' +
        '<div class="vp-err" id="commentMsg"></div>' +
        '<div class="vp-list" id="commentList"><div class="center-loading" style="min-height:60px"><div class="loader"></div></div></div>' +
      '</div>' +
    '</div>';

  renderActions(lesson, nextId);
  if (S && !blocked) {
    $('videoCover').addEventListener('click', function start() {
      $('videoCover').classList.add('is-hidden'); $('videoWrap').classList.add('is-playing');
      startPlayer(S);
      $('videoCover').removeEventListener('click', start);
    });
    getOrCreateWatermarkCode(currentUser.uid, function (code) { startVideoWatermark($('videoWrap'), code, currentUserData.name || ''); });
    setInterval(flush, 4000);
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });
  }
  /* تسجيل المشاهدة وتحديث اكتمال المحاضرة */
  progRef.child('videos/' + videoId + '/watched').set(true).then(function () {
    return progRef.once('value');
  }).then(function (s) {
    const c = computeLessonCompletion(lesson, s.val() || {});
    progRef.update({ completed: c.completed, earnedPoints: c.earnedPoints });
  });
  loadComments();
  $('sendCommentBtn').onclick = sendComment;
  $('commentInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendComment(); });
}

/* ===== الأزرار تحت المشغّل: اختبار، ملف شرح، مفضلة، مشاركة، التالي ===== */
function renderActions(lesson, nextId) {
  const box = $('vpActions'), now = Date.now();
  const mats = lesson.materials || {}, mid = Object.keys(mats);
  const exams = lesson.exams || {}, eid = Object.keys(exams).filter(function (k) { return !exams[k].releaseAt || exams[k].releaseAt <= now; });
  box.innerHTML =
    (eid.length ? '<a class="vp-act main" href="exam.html?comp=' + qs(compId) + '&lesson=' + qs(lessonId) + '&exam=' + qs(eid[0]) + '"><i class="fas fa-list-check"></i> اختبار تطبيقي</a>' : '') +
    (mid.length ? '<a class="vp-act" href="' + escapeHtml(mats[mid[0]].url) + '" target="_blank" rel="noopener"><i class="fas fa-file-lines"></i> ملف شرح</a>' : '') +
    '<button type="button" class="vp-act" id="favoriteBtn" style="display:none"></button>' +
    '<button type="button" class="vp-act" id="shareBtn"><i class="fas fa-share-nodes"></i> مشاركة</button>' +
    (nextId ? '<a class="vp-act go" href="' + vHref(nextId) + '">الفيديو التالي <i class="fas fa-arrow-left"></i></a>' : '');

  /* المفضلة */
  const btn = $('favoriteBtn'), favRef = db.ref('favorites/' + currentUser.uid + '/' + lessonId);
  const paint = function (on) { btn.innerHTML = '<i class="fas fa-' + (on ? 'circle-check' : 'star') + '"></i> ' + (on ? 'في المفضلة' : 'إضافة للمفضلة'); btn.classList.toggle('on', on); };
  favRef.once('value').then(function (s) { paint(!!s.val()); btn.style.display = ''; });
  btn.onclick = function () { favRef.once('value').then(function (s) { const on = !!s.val(); return favRef.set(on ? null : true).then(function () { paint(!on); }); }); };

  /* المشاركة */
  const sh = $('shareBtn'), orig = sh.innerHTML;
  const flash = function (t) { sh.innerHTML = '<i class="fas fa-check"></i> ' + t; setTimeout(function () { sh.innerHTML = orig; }, 2200); };
  const copy = function () {
    const url = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { flash('تم نسخ الرابط'); }, function () { prompt('انسخ رابط الفيديو من هنا:', url); });
    else prompt('انسخ رابط الفيديو من هنا:', url);
  };
  sh.onclick = function () {
    if (navigator.share) navigator.share({ title: $('videoTitle').textContent, url: location.href }).then(function () { flash('تمت المشاركة'); }, function (e) { if (!e || e.name !== 'AbortError') copy(); });
    else copy();
  };
}

/* ===== قائمة المحاضرة الجانبية ===== */
function renderSide(lessons, l, lp) {
  const now = Date.now(), desc = (l.description || '').trim(), LIM = 90;
  const videos = l.videos || {}, exams = l.exams || {};
  const vk = Object.keys(videos);
  const watched = vk.filter(function (v) { return !!(lp.videos && lp.videos[v] && lp.videos[v].watched); }).length;
  const ek = Object.keys(exams).filter(function (k) { return !exams[k].releaseAt || exams[k].releaseAt <= now; });
  const pct = vk.length ? Math.round(watched / vk.length * 100) : 0;
  const vHtml = vk.map(function (v, i) {
    const w = !!(lp.videos && lp.videos[v] && lp.videos[v].watched), cur = v === videoId;
    return '<a class="vp-it' + (cur ? ' active' : '') + (w && !cur ? ' done' : '') + '" href="' + vHref(v) + '"' + (cur ? ' aria-current="true"' : '') + '><span class="no">' + (cur ? '<i class="fas fa-play" style="font-size:10px"></i>' : (w ? '<i class="fas fa-check" style="font-size:11px"></i>' : (i + 1))) + '</span><span class="t">' + escapeHtml(videos[v].title || 'فيديو الشرح') + '</span></a>';
  }).join('');
  const eHtml = ek.map(function (k) {
    const done = !!(lp.exams && lp.exams[k] && lp.exams[k].completed);
    return '<a class="vp-it exam" href="exam.html?comp=' + qs(compId) + '&lesson=' + qs(lessonId) + '&exam=' + qs(k) + '"><span class="no"><i class="fas fa-list-check" style="font-size:12px"></i></span><span class="t">' + escapeHtml(exams[k].title || 'اختبار تطبيقي') + '</span>' + (done ? '<i class="fas fa-circle-check ok"></i>' : '') + '</a>';
  }).join('');
  const side = $('videoSidebar');
  side.innerHTML = '<div class="vp-card"><div class="vp-sh0"><h2 class="vp-lt">' + escapeHtml(l.title || 'محاضرة') + '</h2>' +
    '<div class="vp-lmeta">' + watched + ' من ' + vk.length + ' فيديو' + (ek.length ? ' · ' + ek.length + ' اختبار' : '') + '</div>' +
    '<div class="vp-lbar"><i style="width:' + pct + '%"></i></div>' +
    (desc ? '<p class="vp-ld"><span id="ldText">' + escapeHtml(desc.length > LIM ? desc.slice(0, LIM).trim() + '…' : desc) + '</span>' + (desc.length > LIM ? '<button type="button" class="vp-more" id="ldMore">عرض المزيد</button>' : '') + '</p>' : '') + '</div>' +
    '<div class="vp-listbox"><div class="vp-sh">الشرح</div>' + (vHtml || '<div class="vp-empty">لا يوجد فيديوهات</div>') +
    (eHtml ? '<div class="vp-sh">التطبيق التفاعلي</div>' + eHtml : '') + '</div></div>';
  side.style.display = '';
  $('eyebrow').innerHTML = '<i class="fas fa-layer-group"></i> ' + escapeHtml(l.title || 'محاضرة');
  const more = $('ldMore');
  if (more) { let open = false; more.onclick = function () { open = !open; $('ldText').textContent = open ? desc : desc.slice(0, LIM).trim() + '…'; more.textContent = open ? 'عرض أقل' : 'عرض المزيد'; }; }
}

/* ===== إحصائيات المشاهدة =====
   المشاهدة بتتحسب على أساس "كام ثانية من الفيديو اتشافت" مش كام دقيقة الطالب قعد.
   - لو شغّل بسرعة 1.5x وخلّص 80% من الفيديو في وقت أقل، بتتحسب عادي.
   - الضغط على التقديم/السحب في شريط التقدّم بيتخطّى ثواني من غير ما تتسجّل كمشاهدة.
   - الثانية اللي اتشافت مرتين بتتحسب مرة واحدة. */
function sampleWatch(cur, dur, playing, rate) {
  const now = performance.now();
  if (!playing || !isFinite(cur)) { lastPos = null; return; }
  if (lastPos !== null) {
    const wallSec = (now - lastWall) / 1000, delta = cur - lastPos;
    // التقدّم الطبيعي لا يزيد عن (الوقت الحقيقي × السرعة) — أي قفزة أكبر تعتبر سحب/تخطّي
    const maxNatural = wallSec * Math.max(rate || 1, 1) * 1.5 + 0.5;
    if (delta > 0 && delta <= maxNatural) {
      for (let s2 = Math.floor(lastPos); s2 <= Math.floor(cur); s2++) if (s2 >= 0 && s2 < dur) seen.add(s2);
    }
  }
  lastPos = cur; lastWall = now;
}
function trackProgress() {
  let coverage;
  if (P.tracked) {
    const dur = P.dur(); if (!(dur > 0)) return;
    sampleWatch(P.time(), dur, P.playing(), P.rate());
    coverage = Math.min(100, seen.size / Math.ceil(dur) * 100);
  } else {
    /* مصدر مضمّن (Drive/Facebook/...) مينفعش نقيس تقدّمه: بنحسب وقت وجود الطالب على الصفحة مقابل مدة الفيديو (أو 5 دقايق لو مش محددة) */
    const total = (Number(curVideo && curVideo.durationMinutes) || 5) * 60;
    coverage = Math.min(100, watchAccum / total * 100);
  }
  if (coverage > maxPct) {
    maxPct = coverage;
    const l = $('pctLabel'), f = $('pctFill');
    if (l) l.textContent = Math.round(maxPct) + '%';
    if (f) f.style.width = Math.round(maxPct) + '%';
  }
  if (!viewCounted && coverage >= VIEW_THRESHOLD * 100) {
    viewCounted = true;
    progRef.child('videos/' + videoId + '/viewsUsed').transaction(function (c) { return (Number(c) || 0) + 1; }).then(function (res) {
      viewsUsed = res && res.snapshot ? (Number(res.snapshot.val()) || viewsUsed + 1) : viewsUsed + 1;
      const el = $('statViews'); if (el) el.textContent = viewsUsed + ' من ' + maxViews;
      if (viewsUsed >= maxViews && typeof showToast === 'function') showToast('كده استخدمت كل المشاهدات المتاحة لهذه المحاضرة (' + maxViews + ')', 'info');
    });
  }
}
function tickWatch() {
  if (!P) return;
  if (P.tracked ? !P.playing() : document.visibilityState !== 'visible') return;
  watchAccum++;
  const el = $('statWatch'); if (el) el.textContent = fmtWatch(watchBase + watchAccum);
}
function flush() {
  if (!progRef) return;
  const u = {};
  if (watchAccum > flushedAccum) { u['videos/' + videoId + '/totalWatchSeconds'] = watchBase + watchAccum; flushedAccum = watchAccum; }
  const r = Math.round(maxPct);
  if (r > flushedPct) { u['videos/' + videoId + '/maxWatchedPercent'] = r; flushedPct = r; }
  if (Object.keys(u).length) progRef.update(u);
}

/* ===== ربط المشغّل الشامل (player.js) ===== */
let P = null, curVideo = null;
function startPlayer(S) {
  P = ASBPlayer.mount($('videoWrap'), S, {
    onState: function (s) { const ov = $('endOv'); if (!ov) return; if (s === 'ended') ov.classList.add('show'); else if (s === 'playing') ov.classList.remove('show'); },
    onReady: function () { const d = $('statDuration'); if (d && d.textContent === '—' && P) { const s = P.dur(); if (s > 0) d.textContent = fmtMin(s / 60); } },
    onTick: function () { if (P) trackProgress(); }
  });
  setInterval(tickWatch, 1000);
  $('replayBtn').onclick = function () {
    if (viewsUsed >= maxViews) { location.reload(); return; }   // خلّص مشاهداته: الصفحة هتعرض رسالة القفل
    $('endOv').classList.remove('show');
    seen = new Set(); lastPos = null; viewCounted = false;      // إعادة المشاهدة = محاولة جديدة بتتحسب لو اكتملت 80%
    P.seek(0); P.play();
  };
}

/* ===== التعليقات (القراءة للجميع، والرد للمسؤول فقط) ===== */
function commentsRef() { return db.ref('competitions/' + compId + '/lessons/' + lessonId + '/videos/' + videoId + '/comments'); }
function loadComments() {
  commentsRef().on('value', function (snap) {
    const data = snap.val() || {}, list = $('commentList');
    const cc = $('cmtCount'); if (cc) cc.textContent = Object.keys(data).length;
    if (!list) return;
    const ids = Object.keys(data).sort(function (a, b) { return (data[a].createdAt || 0) - (data[b].createdAt || 0); });
    if (!ids.length) { list.innerHTML = '<div class="vp-empty"><i class="fas fa-comment-dots" style="font-size:26px;display:block;margin-bottom:8px"></i>لا توجد تعليقات بعد، كن أول من يسأل أو يعلّق.</div>'; return; }
    list.innerHTML = ids.map(function (id) {
      const c = data[id], r = c.adminReply;
      let out = '<div class="vp-c"><span class="vp-av">' + escapeHtml((c.name || '؟').trim().charAt(0)) + '</span><div class="vp-cb"><div class="vp-cn">' + escapeHtml(c.name || 'مستخدم') + '<small>' + formatArabicDate(c.createdAt) + '</small></div><p class="vp-ct">' + escapeHtml(c.text) + '</p></div></div>';
      if (r) out += '<div class="vp-c admin"><span class="vp-av"><i class="fas fa-shield-halved"></i></span><div class="vp-cb"><div class="vp-cn">إدارة المنصة<small>' + formatArabicDate(r.createdAt) + '</small></div><p class="vp-ct">' + escapeHtml(r.text) + '</p></div></div>';
      else if (currentUserData.isAdmin) out += '<div class="vp-reply"><input type="text" class="reply-input" data-comment="' + id + '" placeholder="اكتب ردًا كإدارة المنصة..."><button class="reply-send-btn" data-comment="' + id + '">رد</button></div>';
      return out;
    }).join('');
    if (currentUserData.isAdmin) {
      list.querySelectorAll('.reply-send-btn').forEach(function (b) { b.onclick = function () { sendReply(b.dataset.comment); }; });
      list.querySelectorAll('.reply-input').forEach(function (i) { i.addEventListener('keydown', function (e) { if (e.key === 'Enter') sendReply(i.dataset.comment); }); });
    }
  });
}
function shakeEl(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); el.focus(); }
function sendComment() {
  const input = $('commentInput'), btn = $('sendCommentBtn'), msg = $('commentMsg'), text = input.value.trim();
  msg.classList.remove('show');
  if (!text) { shakeEl(input); return; }
  input.disabled = btn.disabled = true; btn.textContent = '...';
  commentsRef().push({ uid: currentUser.uid, name: currentUserData.name || 'مستخدم', text: text, createdAt: firebase.database.ServerValue.TIMESTAMP })
    .then(function () { input.value = ''; })
    .catch(function (err) { msg.textContent = 'تعذر إرسال التعليق' + (err && err.message ? ': ' + err.message : '') + '، حاول مرة أخرى'; msg.classList.add('show'); })
    .then(function () { input.disabled = btn.disabled = false; btn.textContent = 'إرسال'; input.focus(); });
}
function sendReply(commentId) {
  const input = document.querySelector('.reply-input[data-comment="' + commentId + '"]'), btn = document.querySelector('.reply-send-btn[data-comment="' + commentId + '"]');
  const text = input.value.trim();
  if (!text) { shakeEl(input); return; }
  input.disabled = btn.disabled = true;
  const ref = commentsRef().child(commentId);
  ref.once('value').then(function (s) {
    const c = s.val();
    return ref.child('adminReply').set({ text: text, createdAt: firebase.database.ServerValue.TIMESTAMP }).then(function () {
      if (c && c.uid && c.uid !== currentUser.uid) {
        return db.ref('notifications/' + c.uid).push({
          type: 'reply', title: 'تم الرد على تعليقك', body: text.length > 60 ? text.slice(0, 60) + '…' : text,
          link: 'video.html?comp=' + compId + '&lesson=' + lessonId + '&video=' + videoId, read: false, createdAt: firebase.database.ServerValue.TIMESTAMP
        }).catch(function (e) { console.error('تعذر إرسال إشعار الرد:', e); });
      }
    });
  }).catch(function (err) { console.error('تعذر إرسال الرد:', err); input.disabled = btn.disabled = false; });
}
</script>
